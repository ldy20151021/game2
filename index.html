<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>绝地求生 - 战术行动</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Microsoft YaHei',sans-serif;color:#e0e0e0;user-select:none;-webkit-user-select:none}
canvas{display:block}
.hidden{display:none!important}
#main-menu{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0a0f14,#1a2530,#0d151c);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto}
.menu-container{text-align:center;width:95%;max-width:900px;padding:20px 0}
.game-logo{font-size:min(10vw,56px);font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,#fff,#f8b500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
.game-subtitle{color:#8899aa;font-size:14px;letter-spacing:3px;margin-bottom:30px}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:25px}
.mode-card{padding:16px 10px;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08);border-radius:10px;cursor:pointer;transition:all .2s;text-align:center}
.mode-card:active{transform:scale(.95)}
.mode-card.selected{border-color:#f8b500;background:rgba(248,181,0,.1);box-shadow:0 0 20px rgba(248,181,0,.2)}
.mode-icon{font-size:28px;margin-bottom:6px;display:block}
.mode-card h3{font-size:13px;margin-bottom:4px;color:#fff}
.mode-card p{font-size:10px;color:#8899aa;line-height:1.3}
.btn-primary{padding:15px 50px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#f8b500,#ff8c00);border:none;border-radius:8px;color:#000;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(248,181,0,.3);display:inline-block;text-align:center}
.btn-primary:active{transform:scale(.95)}
.btn-primary.disabled{opacity:.5;pointer-events:none}
#loading-status{margin-top:15px;font-size:13px;color:#8899aa;min-height:20px}
#loading-status.error{color:#f44}
#loading-status.ok{color:#4a4}
.menu-tabs{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.menu-tab{padding:8px 18px;background:transparent;border:1px solid rgba(255,255,255,.1);color:#8899aa;font-size:13px;cursor:pointer;border-radius:4px;transition:all .2s}
.menu-tab:active{transform:scale(.95)}
.menu-tab.active{background:#f8b500;color:#000;border-color:#f8b500;font-weight:bold}
.menu-content{display:none}.menu-content.active{display:block}
.settings-panel{text-align:left;max-width:400px;margin:0 auto}
.setting-group{margin-bottom:12px;background:rgba(255,255,255,.03);padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.06)}
.setting-group h4{color:#f8b500;margin-bottom:8px;font-size:13px}
.setting-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.setting-row input[type="range"]{width:120px;accent-color:#f8b500}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:500px;margin:0 auto 20px}
.stat-card{background:rgba(255,255,255,.03);padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.06);text-align:center}
.stat-val{font-size:22px;font-weight:bold;color:#f8b500}
.stat-label{font-size:10px;color:#8899aa;margin-top:3px}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#hud.active{display:block}
.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ch-line{position:absolute;background:rgba(255,255,255,.9)}
.ch-t{left:50%;top:-12px;width:2px;height:8px;transform:translateX(-50%)}
.ch-b{left:50%;bottom:-12px;width:2px;height:8px;transform:translateX(-50%)}
.ch-l{left:-12px;top:50%;width:8px;height:2px;transform:translateY(-50%)}
.ch-r{right:-12px;top:50%;width:8px;height:2px;transform:translateY(-50%)}
.ch-dot{position:absolute;left:50%;top:50%;width:2px;height:2px;background:#f44;border-radius:50%;transform:translate(-50%,-50%)}
.hitmarker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0}
.hitmarker.show{opacity:1}
.hm-line{position:absolute;width:12px;height:2px;background:#fff}
.hm-1{transform:rotate(45deg) translate(6px,6px)}
.hm-2{transform:rotate(-45deg) translate(-6px,6px)}
.hm-3{transform:rotate(225deg) translate(6px,6px)}
.hm-4{transform:rotate(-225deg) translate(-6px,6px)}
#top-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:15px;background:rgba(0,0,0,.5);padding:5px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1)}
#top-info .info-item{text-align:center}
#top-info .info-val{font-size:15px;font-weight:bold;color:#fff}
#top-info .info-label{font-size:9px;color:#8899aa}
#kill-feed{position:absolute;top:45px;right:10px;width:220px;pointer-events:none}
.kill-msg{background:rgba(0,0,0,.6);padding:4px 8px;margin-bottom:2px;border-radius:3px;font-size:10px;color:#fff;border-left:2px solid #f8b500;animation:kf 3s forwards}
@keyframes kf{0%{opacity:0;transform:translateX(20px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#status-bars{position:absolute;bottom:12px;left:12px;width:180px}
.status-bar{margin-bottom:5px}
.status-bar-bg{width:100%;height:13px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.1);border-radius:3px;overflow:hidden;position:relative}
.status-bar-fill{height:100%;transition:width .3s}
.hp-fill{background:linear-gradient(90deg,#c62828,#e53935)}
.armor-fill{background:linear-gradient(90deg,#1565c0,#1e88e5)}
.status-bar-text{position:absolute;inset:0;display:flex;align-items:center;padding:0 5px;font-size:9px;color:#fff}
#weapon-panel{position:absolute;bottom:12px;right:12px;text-align:right}
#weapon-name-display{font-size:11px;color:#f8b500;margin-bottom:2px}
#ammo-display{font-size:28px;font-weight:bold;color:#fff}
#ammo-display .reserve{font-size:14px;color:#8899aa}
#minimap-container{position:absolute;top:10px;left:10px;width:110px;height:110px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
#minimap-canvas{width:100%;height:100%}
#zone-warning{position:absolute;top:55px;left:50%;transform:translateX(-50%);background:rgba(200,0,0,.8);color:#fff;padding:5px 14px;border-radius:4px;font-size:12px;display:none;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#interact-prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:5px 14px;border-radius:4px;font-size:12px;color:#fff;display:none;border:1px solid #f8b500}
.overlay{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;z-index:15}
#dmg-overlay{background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.4))}
#heal-overlay{background:radial-gradient(ellipse at center,transparent 40%,rgba(0,255,100,.2))}
#drop-screen{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#drop-screen.active{display:flex}
#drop-altitude{font-size:min(14vw,56px);font-weight:900;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5)}
#drop-speed{font-size:18px;color:#f8b500;margin-top:8px}
#drop-prompt{font-size:15px;color:#fff;margin-top:25px;animation:pulse 1.5s infinite}
#pause-menu{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column}
#pause-menu.active{display:flex}
#pause-menu h2{font-size:28px;color:#fff;margin-bottom:25px}
.pause-btn{display:block;width:200px;padding:12px;margin:6px 0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;cursor:pointer;border-radius:6px;text-align:center}
.pause-btn:active{background:#f8b500;color:#000}
#death-screen{position:fixed;inset:0;z-index:300;background:rgba(20,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column}
#death-screen.active{display:flex}
#death-screen h1{font-size:min(9vw,42px);color:#e53935;margin-bottom:15px;text-align:center;padding:0 10px}
#death-screen.victory h1{color:#f8b500}
.death-stats{display:flex;gap:20px;margin-bottom:25px;flex-wrap:wrap;justify-content:center}
.death-stat{text-align:center}
.death-stat .val{font-size:24px;font-weight:bold;color:#fff}
.death-stat .label{font-size:10px;color:#8899aa;margin-top:2px}
#mobile-controls{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#mobile-controls.active{display:block}
.joystick-zone{position:absolute;bottom:50px;left:15px;width:110px;height:110px;pointer-events:auto;touch-action:none}
.joystick-base{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);position:relative}
.joystick-thumb{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.4);position:absolute;left:27px;top:27px}
.look-zone{position:absolute;top:0;right:0;width:55%;height:70%;pointer-events:auto;touch-action:none}
.mobile-btn{position:absolute;pointer-events:auto;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:bold;touch-action:none}
.mobile-btn:active{background:rgba(248,181,0,.3);border-color:#f8b500}
#btn-fire{bottom:70px;right:20px;width:65px;height:65px;font-size:13px;background:rgba(255,50,50,.2);border-color:rgba(255,50,50,.4)}
#btn-jump{bottom:150px;right:80px}
#btn-reload{bottom:150px;right:20px}
#btn-crouch{bottom:70px;right:100px}
#btn-ads{bottom:220px;right:20px}
#btn-wswitch{top:130px;right:10px;width:42px;height:42px}
.dmg-number{position:fixed;pointer-events:none;font-weight:bold;font-size:15px;color:#fff;text-shadow:0 1px 3px #000;z-index:20;animation:floatUp 1s forwards}
.dmg-number.headshot{color:#f44;font-size:19px}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-35px)}}
</style>
</head>
<body>

<div id="main-menu">
  <div class="menu-container">
    <div class="game-logo">绝地求生</div>
    <div class="game-subtitle">战 术 行 动</div>
    <div class="menu-tabs">

</div>

<div id="hud">
  <div class="crosshair"><div class="ch-line ch-t"></div><div class="ch-line ch-b"></div><div class="ch-line ch-l"></div><div class="ch-line ch-r"></div><div class="ch-dot"></div></div>

<!-- 菜单逻辑 - 不依赖 Three.js，保证按钮一定能点 -->
<script>
(function(){
  var selectedMode='battle';
  var isMobile=/Android|iPhone|iPad|iPod|webOS|BlackBerry/i.test(navigator.userAgent)||('ontouchstart'in window);
  
  // Tab 切换
  document.getElementById('tab-btn-play').onclick=function(){switchTab('play');};
  document.getElementById('tab-btn-stats').onclick=function(){switchTab('stats');};
  document.getElementById('tab-btn-settings').onclick=function(){switchTab('settings');};
  function switchTab(name){
    document.querySelectorAll('.menu-tab').forEach(function(t){t.classList.remove('active');});
    document.querySelectorAll('.menu-content').forEach(function(c){c.classList.remove('active');});
    document.getElementById('tab-btn-'+name).classList.add('active');
    document.getElementById('tab-'+name).classList.add('active');
  }
  
  // 模式选择
  document.querySelectorAll('.mode-card').forEach(function(card){
    card.onclick=function(){
      document.querySelectorAll('.mode-card').forEach(function(c){c.classList.remove('selected');});
      card.classList.add('selected');
      selectedMode=card.getAttribute('data-mode');
    };
  });
  
  // 设置
  var sensEl=document.getElementById('set-sens');
  var fovEl=document.getElementById('set-fov');
  if(sensEl)sensEl.oninput=function(){document.getElementById('val-sens').textContent=this.value;};
  if(fovEl)fovEl.oninput=function(){document.getElementById('val-fov').textContent=this.value;};
  
  // 存档
  var save=JSON.parse(localStorage.getItem('pubg_save')||'{"kills":0,"wins":0,"games":0}');
  document.getElementById('stat-kills').textContent=save.kills;
  document.getElementById('stat-wins').textContent=save.wins;
  document.getElementById('stat-games').textContent=save.games;
  
  // 开始按钮
  document.getElementById('btn-start').onclick=function(){
    var status=document.getElementById('loading-status');
    status.textContent='正在加载游戏引擎...';
    status.className='';
    // 通知 module 脚本开始游戏
    window._startGame={mode:selectedMode,isMobile:isMobile};
    if(window.gameReady){
      window.startGameFn(selectedMode,isMobile);
    }else{
      status.textContent='游戏引擎尚未加载完成，请稍候...';
      status.className='error';
      // 等待
      var checkInterval=setInterval(function(){
        if(window.gameReady){
          clearInterval(checkInterval);
          window.startGameFn(selectedMode,isMobile);
        }
      },500);
      // 超时
      setTimeout(function(){
        clearInterval(checkInterval);
        if(!window.gameReady){
          status.textContent='❌ 游戏引擎加载失败！请检查网络连接后刷新页面。';
          status.className='error';
        }
      },15000);
    }
  };
  
  // 暴露给全局
  window._menuReady=true;
})();
</script>

<!-- Three.js 游戏引擎 -->
<script type="module">
let THREE;
try{
  THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js');
}catch(e1){
  try{
    THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  }catch(e2){
    try{
      THREE=await import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js');
    }catch(e3){
      document.getElementById('loading-status').textContent='❌ Three.js 加载失败，请检查网络！';
      document.getElementById('loading-status').className='error';
      throw e3;
    }
  }
}

// ===== 到这里说明 Three.js 加载成功 =====
document.getElementById('loading-status').textContent='✅ 引擎加载完成，可以开始游戏';
document.getElementById('loading-status').className='ok';

const CONFIG={MAP_SIZE:200,GRAVITY:25,JUMP_FORCE:8,PLAYER_HEIGHT:1.7,PLAYER_RADIUS:0.4,CROUCH_HEIGHT:1.0,DROP_ALTITUDE:1000,ZONE_R:90,ZONE_INTERVAL:45,ZONE_DMG:2};
const isMobile=/Android|iPhone|iPad|iPod|webOS|BlackBerry/i.test(navigator.userAgent)||('ontouchstart'in window);

// 场景
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.FogExp2(0x87CEEB,0.004);
const camera=new THREE.PerspectiveCamera(85,innerWidth/innerHeight,0.1,500);
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
}catch(e){
  document.getElementById('loading-status').textContent='❌ 您的设备不支持WebGL！';
  document.getElementById('loading-status').className='error';
  throw e;
}
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.5));
const sun=new THREE.DirectionalLight(0xfff5e6,1.6);
sun.position.set(60,100,40);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-80;sun.shadow.camera.right=80;
sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x87CEEB,0x3d5c3a,0.3));

// 地图

class Enemy{
  constructor(x,z,type){
    this.type=type;this.alive=true;
    this.group=new THREE.Group();this.group.userData.isEnemy=true;
    const cfg={normal:{hp:50,spd:4,dmg:8,color:0x4a6b4a,rate:500},fast:{hp:30,spd:7,dmg:5,color:0x6b4a6b,rate:300},heavy:{hp:120,spd:2.5,dmg:15,color:0x3a3a6b,rate:700},zombie:{hp:60,spd:3.5,dmg:12,color:0x3a6b3a,rate:1000,melee:true}};
    this.cfg=cfg[type]||cfg.normal;
    this.hp=this.cfg.hp;this.maxHp=this.cfg.hp;this.lastShot=0;this.strafeDir=1;this.strafeTimer=0;
    const cloth=new THREE.MeshStandardMaterial({color:this.cfg.color,roughness:.75});
    const skin=new THREE.MeshStandardMaterial({color:type==='zombie'?0x6b9b6b:0xd4a574});
    const dark=new THREE.MeshStandardMaterial({color:0x1a1a1a});
    this.torso=new THREE.Mesh(new THREE.BoxGeometry(.5,.7,.3),cloth);this.torso.position.y=1.15;this.torso.castShadow=true;this.group.add(this.torso);
    this.head=new THREE.Mesh(new THREE.BoxGeometry(.28,.28,.28),skin);this.head.position.y=1.7;this.head.castShadow=true;this.group.add(this.head);
    const eyeMat=new THREE.MeshStandardMaterial({color:type==='zombie'?0x00ff00:0x111111,emissive:type==='zombie'?0x00ff00:0,emissiveIntensity:type==='zombie'?2:0});
    const eL=new THREE.Mesh(new THREE.BoxGeometry(.05,.04,.02),eyeMat);eL.position.set(-.07,1.72,.15);this.group.add(eL);
    const eR=eL.clone();eR.position.x=.07;this.group.add(eR);
    this.aL=new THREE.Mesh(new THREE.BoxGeometry(.12,.55,.12),cloth);this.aL.position.set(-.34,1.1,0);this.group.add(this.aL);
    this.aR=new THREE.Mesh(new THREE.BoxGeometry(.12,.55,.12),cloth);this.aR.position.set(.34,1.1,0);this.group.add(this.aR);
    this.lL=new THREE.Mesh(new THREE.BoxGeometry(.15,.65,.15),dark);this.lL.position.set(-.12,.33,0);this.group.add(this.lL);
    this.lR=new THREE.Mesh(new THREE.BoxGeometry(.15,.65,.15),dark);this.lR.position.set(.12,.33,0);this.group.add(this.lR);
    if(type!=='zombie'){const gun=new THREE.Mesh(new THREE.BoxGeometry(.04,.05,.4),new THREE.MeshStandardMaterial({color:0x333333,metalness:.7}));gun.position.set(.3,1.15,-.2);this.group.add(gun);}
    this.group.position.set(x,0,z);scene.add(this.group);
  }
  update(dt){
    if(!this.alive)return;
    const toP=new THREE.Vector3().subVectors(G.player.pos,this.group.position);toP.y=0;
    const dist=toP.length();const dir=toP.clone().normalize();
    const t=performance.now()*.001*4;
    this.aL.rotation.x=Math.sin(t)*.4;this.aR.rotation.x=-Math.sin(t)*.4;
    this.lL.rotation.x=-Math.sin(t)*.3;this.lR.rotation.x=Math.sin(t)*.3;
    if(dist>2.5){
      this.strafeTimer-=dt;if(this.strafeTimer<=0){this.strafeDir*=-1;this.strafeTimer=1+Math.random()*2;}
      const strafe=new THREE.Vector3(-dir.z,0,dir.x).multiplyScalar(this.strafeDir);
      let mv;
      if(dist>15)mv=dir.clone().add(strafe.multiplyScalar(.3)).normalize();
      else if(dist<5&&!this.cfg.melee)mv=dir.clone().multiplyScalar(-1);
      else mv=strafe.normalize();
      this.group.position.addScaledVector(mv,this.cfg.spd*dt);
      this.group.rotation.y=Math.atan2(dir.x,dir.z);
    }else{
      this.group.rotation.y=Math.atan2(dir.x,dir.z);
      const now=performance.now();
      if(now-this.lastShot>this.cfg.rate){this.lastShot=now;takeDamage(this.cfg.dmg,this.group.position);}
    }
    if(!this.cfg.melee&&dist<50&&dist>2.5){
      const now=performance.now();
      if(now-this.lastShot>this.cfg.rate){
        this.lastShot=now;
        if(Math.random()<.35*(1-dist/60))takeDamage(this.cfg.dmg,this.group.position);
        sfx('enemy_shoot',.3);
      }
    }
    const half=CONFIG.MAP_SIZE/2-5;
    this.group.position.x=Math.max(-half,Math.min(half,this.group.position.x));
    this.group.position.z=Math.max(-half,Math.min(half,this.group.position.z));
  }
  takeDamage(amount,isHead){
    if(!this.alive)return;
    this.hp-=amount;
    this.torso.material.emissive.setHex(0xff0000);
    setTimeout(()=>{if(this.alive)this.torso.material.emissive.setHex(0);},80);
    if(this.hp<=0)this.die();
  }
  die(){
    this.alive=false;G.kills++;
    sfx('kill');
    addKillMsg('你','击杀了'+(this.type==='zombie'?'丧尸':'敌兵'));
    spawnParticles(this.group.position.clone().add(new THREE.Vector3(0,1.2,0)),0xcc0000,15,5,1);
    const st=performance.now();
    const anim=()=>{const t=(performance.now()-st)/700;if(t>=1){scene.remove(this.group);return;}this.group.rotation.x=t*Math.PI/2*.9;this.group.position.y=-t*.5;requestAnimationFrame(anim);};
    anim();
    if(G.enemies.filter(e=>e.alive).length===0&&G.mode==='battle'&&G.hp>0)endMatch(true);
    updateHUD();
  }
}

// 音频
let audioCtx=null;
function sfx(type,vol=1){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  const t=audioCtx.currentTime;
  const S={shoot:[180,40,.08,.2],hit:[600,200,.05,.15],kill:[500,900,.12,.2],damage:[90,35,.15,.3],explosion:[45,12,.4,.5],melee:[130,70,.08,.2],reload:[300,500,.15,.1],enemy_shoot:[200,60,.07,.1],parachute:[200,300,.3,.15]};
  const s=S[type]||S.shoot;
  o.frequency.setValueAtTime(s[0],t);o.frequency.exponentialRampToValueAtTime(s[1],t+s[2]);
  g.gain.setValueAtTime(s[3]*vol,t);g.gain.exponentialRampToValueAtTime(.01,t+s[2]);
  o.start(t);o.stop(t+s[2]+.02);
}

function spawnParticles(pos,color,n,spd,life){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.06,.06,.06),new THREE.MeshBasicMaterial({color,transparent:true}));
    m.position.copy(pos);scene.add(m);
    const v=new THREE.Vector3((Math.random()-.5)*spd,Math.random()*spd*.7,(Math.random()-.5)*spd);
    G.particles.push({mesh:m,vel:v,life,maxLife:life});
  }
}

function takeDamage(amount,fromPos){
  if(G.state!=='playing')return;
  if(G.armor>0){const ab=Math.min(G.armor,amount*.6);G.armor-=ab;amount-=ab;}
  G.hp-=amount;
  $('dmg-overlay').style.opacity='1';setTimeout(()=>$('dmg-overlay').style.opacity='0',200);
  sfx('damage',.5);
  updateHUD();
  if(G.hp<=0)endMatch(false);
}

function addKillMsg(killer,victim){
  const feed=$('kill-feed');
  const msg=document.createElement('div');msg.className='kill-msg';
  msg.textContent=killer+' → '+victim;
  feed.appendChild(msg);setTimeout(()=>msg.remove(),3000);

}

function updateHUD(){
  const wep=G.weapons[G.curW];
  $('hp-fill').style.width=Math.max(0,G.hp/G.maxHp*100)+'%';
  $('hp-text').textContent=Math.ceil(G.hp);
  $('armor-fill').style.width=(G.armor/G.maxArmor*100)+'%';
  $('armor-text').textContent=Math.ceil(G.armor);

    $('weapon-name-display').textContent=wep.name;
    $('ammo-cur').textContent=wep.melee?'∞':wep.ammo;

  }
  $('hud-alive').textContent=G.enemies.filter(e=>e.alive).length+1;
  $('hud-kills').textContent=G.kills;
}

function shoot(){
  const wep=G.weapons[G.curW];if(!wep)return;
  const now=performance.now();
  if(now-G.lastShot<wep.rate||G.reloading)return;
  if(!wep.melee&&wep.ammo<=0){reload();return;}
  G.lastShot=now;
  if(!wep.melee){wep.ammo--;G.shotsFired++;}
  sfx(wep.melee?'melee':'shoot');
  G.recoilY+=wep.recoil;
  const pellets=wep.pellets||1;
  for(let p=0;p<pellets;p++){
    const spread=wep.spread*(G.isADS?.3:1)*(G.crouching?.7:1);
    const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    dir.x+=(Math.random()-.5)*spread;dir.y+=(Math.random()-.5)*spread;dir.normalize();
    const ray=new THREE.Raycaster(camera.position.clone(),dir,0,wep.range);
    const eMeshes=G.enemies.map(e=>e.group).filter(g=>g.parent);
    const hits=ray.intersectObjects(eMeshes,true);
    if(hits.length>0){
      let eg=hits[0].object;while(eg&&!eg.userData.isEnemy)eg=eg.parent;
      if(eg){
        const enemy=G.enemies.find(e=>e.group===eg);
        if(enemy&&enemy.alive){
          const ly=hits[0].point.y-eg.position.y;
          const isHead=ly>1.5;
          const dmg=wep.dmg*(isHead?2.5:(ly<.8?.6:1));
          enemy.takeDamage(dmg,isHead);
          if(isHead)G.headshots++;
          G.damageDealt+=dmg;
          $('hitmarker').classList.toggle('headshot',isHead);
          $('hitmarker').classList.add('show');setTimeout(()=>$('hitmarker').classList.remove('show'),100);
          sfx('hit',.5);
          spawnParticles(hits[0].point,0xff4444,4,3,.5);
        }
      }
    }
  }
  if(wep.melee){
    for(const e of G.enemies){if(!e.alive)continue;if(e.group.position.distanceTo(G.player.pos)<wep.range){e.takeDamage(wep.dmg,false);break;}}
  }
  updateHUD();
}

function reload(){
  const wep=G.weapons[G.curW];
  if(!wep||wep.melee||G.reloading||wep.ammo>=wep.max||wep.res<=0)return;
  G.reloading=true;sfx('reload');
  setTimeout(()=>{const need=wep.max-wep.ammo;const take=Math.min(need,wep.res);wep.ammo+=take;wep.res-=take;G.reloading=false;updateHUD();},1800);
}

function endMatch(victory){
  G.state='dead';
  const dur=(performance.now()-G.startTime)/1000;
  const save=JSON.parse(localStorage.getItem('pubg_save')||'{"kills":0,"wins":0,"games":0}');
  save.kills+=G.kills;save.games++;if(victory)save.wins++;
  localStorage.setItem('pubg_save',JSON.stringify(save));
  $('death-title').textContent=victory?'🏆 大吉大利，今晚吃鸡！':'已被淘汰';
  $('death-screen').classList.toggle('victory',victory);
  $('death-screen').classList.add('active');
  $('d-kills').textContent=G.kills;
  $('d-dmg').textContent=Math.round(G.damageDealt);
  const mins=Math.floor(dur/60),secs=Math.floor(dur%60);
  $('d-time').textContent=mins+':'+String(secs).padStart(2,'0');
}

// 开始游戏
function startGame(mode){
  G.mode=mode;
  $('main-menu').classList.add('hidden');
  $('hud').classList.add('active');
  if(isMobile)$('mobile-controls').classList.add('active');
  G.hp=100;G.armor=0;G.kills=0;G.damageDealt=0;G.shotsFired=0;G.headshots=0;
  G.player.pos.set(0,CONFIG.DROP_ALTITUDE,0);G.player.vel.set(0,0,0);
  G.yaw=0;G.pitch=0;G.crouching=false;G.isADS=false;
  G.curW=0;G.weapons=[{...WEAPONS[0]},null];G.reloading=false;
  G.isDropping=true;G.parachute=false;G.recoilY=0;
  G.enemies.forEach(e=>scene.remove(e.group));G.enemies=[];
  const counts={battle:12,tdm:8,zombie:6,training:5};
  const types={battle:['normal','normal','heavy','fast'],tdm:['normal','fast'],zombie:['zombie'],training:['normal']};
  const cnt=counts[mode]||10;const tArr=types[mode]||['normal'];
  for(let i=0;i<cnt;i++){
    const a=Math.random()*Math.PI*2,d=25+Math.random()*45;
    G.enemies.push(new Enemy(Math.cos(a)*d,Math.sin(a)*d,tArr[Math.floor(Math.random()*tArr.length)]));
  }
  G.zone={r:CONFIG.ZONE_R,target:CONFIG.ZONE_R,cx:0,cz:0,timer:CONFIG.ZONE_INTERVAL};
  buildWView();updateHUD();
  G.state='dropping';G.startTime=performance.now();
  $('drop-screen').classList.add('active');
  $('drop-prompt').textContent=isMobile?'点击屏幕跳伞':'按空格跳伞';
}

  lookZone.addEventListener('touchmove',e=>{e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===touchId){Input.mouseDX+=(e.changedTouches[i].clientX-lastTX)*2.5;Input.mouseDY+=(e.changedTouches[i].clientY-lastTY)*2.5;lastTX=e.changedTouches[i].clientX;lastTY=e.changedTouches[i].clientY;}}},{passive:false});
  lookZone.addEventListener('touchend',()=>{touchId=null;});
  
  $('btn-fire').addEventListener('touchstart',e=>{e.preventDefault();Input.mouseDown=true;},{passive:false});
  $('btn-fire').addEventListener('touchend',e=>{e.preventDefault();Input.mouseDown=false;},{passive:false});
  $('btn-jump').addEventListener('touchstart',e=>{e.preventDefault();Input.keys['Space']=true;},{passive:false});
  $('btn-jump').addEventListener('touchend',()=>{Input.keys['Space']=false;});
  $('btn-reload').addEventListener('touchstart',e=>{e.preventDefault();reload();},{passive:false});
  $('btn-crouch').addEventListener('touchstart',e=>{e.preventDefault();G.crouching=!G.crouching;},{passive:false});
  $('btn-ads').addEventListener('touchstart',e=>{e.preventDefault();G.isADS=!G.isADS;},{passive:false});
  $('btn-wswitch').addEventListener('touchstart',e=>{e.preventDefault();G.curW=(G.curW+1)%2;if(!G.weapons[G.curW])G.curW=0;buildWView();updateHUD();},{passive:false});
}

// 跳伞点击
$('drop-screen').addEventListener('touchstart',()=>{if(!G.parachute&&G.player.pos.y<CONFIG.DROP_ALTITUDE-50){G.parachute=true;sfx('parachute');$('drop-prompt').textContent='滑动控制方向';}},{passive:true});
$('drop-screen').addEventListener('click',()=>{if(!G.parachute&&G.player.pos.y<CONFIG.DROP_ALTITUDE-50){G.parachute=true;sfx('parachute');$('drop-prompt').textContent='WASD/滑动控制方向';}});

// 按钮
$('btn-resume').onclick=()=>{G.state='playing';$('pause-menu').classList.remove('active');if(!isMobile)renderer.domElement.requestPointerLock();};
$('btn-quit').onclick=quitToMenu;
$('btn-respawn').onclick=quitToMenu;

// 主循环
function checkCollision(pos){
  const r=CONFIG.PLAYER_RADIUS;
  const h=G.crouching?CONFIG.CROUCH_HEIGHT:CONFIG.PLAYER_HEIGHT;
  const box=new THREE.Box3(new THREE.Vector3(pos.x-r,pos.y-h,pos.z-r),new THREE.Vector3(pos.x+r,pos.y+.2,pos.z+r));
  for(const c of colliders)if(c.intersectsBox(box))return true;
  return false;
}

function updateMinimap(){
  const c=$('minimap-canvas').getContext('2d');const w=110;
  c.fillStyle='rgba(20,30,20,.9)';c.fillRect(0,0,w,w);
  const s=w/CONFIG.MAP_SIZE,cx=w/2,cy=w/2;
  if(G.mode==='battle'){c.strokeStyle='rgba(80,80,255,.5)';c.lineWidth=2;c.beginPath();c.arc(cx+G.zone.cx*s,cy+G.zone.cz*s,G.zone.r*s,0,Math.PI*2);c.stroke();}
  c.fillStyle='#444';
  for(const col of colliders){const cw=(col.max.x-col.min.x)*s,ch=(col.max.z-col.min.z)*s;if(cw>2&&ch>2&&cw<35)c.fillRect(cx+(col.min.x+col.max.x)/2*s-cw/2,cy+(col.min.z+col.max.z)/2*s-ch/2,cw,ch);}
  c.fillStyle='#f44';
  for(const e of G.enemies){if(!e.alive)continue;const x=cx+e.group.position.x*s,y=cy+e.group.position.z*s;if(x>0&&x<w&&y>0&&y<w){c.beginPath();c.arc(x,y,3,0,Math.PI*2);c.fill();}}
  c.fillStyle='#fff';
  const px=cx+G.player.pos.x*s,py=cy+G.player.pos.z*s;
  c.beginPath();c.arc(px,py,4,0,Math.PI*2);c.fill();
  c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.moveTo(px,py);c.lineTo(px-Math.sin(G.yaw)*10,py-Math.cos(G.yaw)*10);c.stroke();
}

let last=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;
  
  if(G.state==='dropping'||G.state==='playing'){
    if(G.state==='dropping'){
      if(!G.parachute){G.player.vel.y-=CONFIG.GRAVITY*dt;G.player.vel.y=Math.max(G.player.vel.y,-60);}
      else{G.player.vel.y-=CONFIG.GRAVITY*.1*dt;G.player.vel.y=Math.max(G.player.vel.y,-8);const fw=new THREE.Vector3(-Math.sin(G.yaw),0,-Math.cos(G.yaw));G.player.vel.x=fw.x*15;G.player.vel.z=fw.z*15;}
      G.player.pos.addScaledVector(G.player.vel,dt);
      $('drop-altitude').textContent=Math.max(0,Math.floor(G.player.pos.y))+'米';
      $('drop-speed').textContent='速度: '+Math.floor(Math.abs(G.player.vel.y)*3.6)+' km/h';
      if(!G.parachute&&(Input.keys['Space']||Input.mouseDown)){
        if(G.player.pos.y<CONFIG.DROP_ALTITUDE-50){G.parachute=true;sfx('parachute');$('drop-prompt').textContent=isMobile?'滑动控制方向':'WASD控制方向';}
      }
      if(G.player.pos.y<=CONFIG.PLAYER_HEIGHT){
        G.player.pos.y=CONFIG.PLAYER_HEIGHT;G.player.vel.set(0,0,0);
        G.state='playing';$('drop-screen').classList.remove('active');
        if(!isMobile)renderer.domElement.requestPointerLock();
      }
    }else{
      const sens=(isMobile?3:8)*.001;
      G.yaw-=Input.mouseDX*sens;G.pitch-=Input.mouseDY*sens;
      G.pitch=Math.max(-1.5,Math.min(1.5,G.pitch));
      Input.mouseDX=0;Input.mouseDY=0;
      const spd=5*(G.crouching?.5:1);
      const fw=new THREE.Vector3(-Math.sin(G.yaw),0,-Math.cos(G.yaw));
      const rt=new THREE.Vector3(Math.cos(G.yaw),0,-Math.sin(G.yaw));
      const mv=new THREE.Vector3();
      if(Input.keys['KeyW'])mv.add(fw);if(Input.keys['KeyS'])mv.sub(fw);
      if(Input.keys['KeyD'])mv.add(rt);if(Input.keys['KeyA'])mv.sub(rt);
      mv.x+=fw.x*(-Input.joyY)+rt.x*Input.joyX;
      mv.z+=fw.z*(-Input.joyY)+rt.z*Input.joyX;
      if(mv.lengthSq()>0)mv.normalize();
      G.player.vel.x=mv.x*spd;G.player.vel.z=mv.z*spd;
      G.player.vel.y-=CONFIG.GRAVITY*dt;
      if(Input.keys['Space']&&G.player.onGround){G.player.vel.y=CONFIG.JUMP_FORCE;G.player.onGround=false;}
      const np=G.player.pos.clone();
      np.x+=G.player.vel.x*dt;if(!checkCollision(np))G.player.pos.x=np.x;
      np.z+=G.player.vel.z*dt;if(!checkCollision(np))G.player.pos.z=np.z;
      np.y+=G.player.vel.y*dt;
      if(checkCollision(np)){if(G.player.vel.y<0)G.player.onGround=true;G.player.vel.y=0;}
      else{G.player.pos.y=np.y;G.player.onGround=false;}
      const half=CONFIG.MAP_SIZE/2-2;
      G.player.pos.x=Math.max(-half,Math.min(half,G.player.pos.x));
      G.player.pos.z=Math.max(-half,Math.min(half,G.player.pos.z));
      if(G.player.pos.y<-10){G.player.pos.y=CONFIG.PLAYER_HEIGHT;G.player.vel.y=0;}
      if(Input.mouseDown){const wep=G.weapons[G.curW];if(wep&&(wep.auto||now-G.lastShot>=wep.rate))shoot();}
      for(const e of G.enemies)if(e.alive)e.update(dt);
      // 毒圈
      if(G.mode==='battle'){
        G.zone.timer-=dt;
        if(G.zone.timer<=0){G.zone.target=Math.max(10,G.zone.r*.6);G.zone.timer=CONFIG.ZONE_INTERVAL;G.zone.cx+=(Math.random()-.5)*G.zone.target*.3;G.zone.cz+=(Math.random()-.5)*G.zone.target*.3;addKillMsg('系统','毒圈缩小！');}
        if(G.zone.r>G.zone.target)G.zone.r=Math.max(G.zone.target,G.zone.r-dt*3);
        zoneMesh.scale.set(G.zone.r,1,G.zone.r);zoneMesh.position.x=G.zone.cx;zoneMesh.position.z=G.zone.cz;
        const dx=G.player.pos.x-G.zone.cx,dz=G.player.pos.z-G.zone.cz;
        const dist=Math.sqrt(dx*dx+dz*dz);
        $('zone-warning').style.display=dist<=G.zone.r?'none':'block';
        if(dist>G.zone.r)takeDamage(CONFIG.ZONE_DMG*dt);
        const mins=Math.floor(G.zone.timer/60),secs=Math.floor(G.zone.timer%60);
        $('hud-zone').textContent=mins+':'+String(secs).padStart(2,'0');
      }
    }
    // 相机
    camera.rotation.order='YXZ';
    G.recoilY=THREE.MathUtils.lerp(G.recoilY,0,dt*10);
    camera.rotation.set(G.pitch+G.recoilY,G.yaw,0);
    G.swayT+=dt*(G.player.vel.length()>1?8:2);
    const bob=G.player.vel.length()>1?Math.sin(G.swayT)*.015:0;
    camera.position.set(G.player.pos.x,G.player.pos.y+bob,G.player.pos.z);
    wView.position.z=THREE.MathUtils.lerp(wView.position.z,-.5,dt*10);
    wView.rotation.x=THREE.MathUtils.lerp(wView.rotation.x,0,dt*10);
    // 粒子
    for(let i=G.particles.length-1;i>=0;i--){
      const p=G.particles[i];p.life-=dt;p.vel.y-=15*dt;
      p.mesh.position.addScaledVector(p.vel,dt);
      p.mesh.material.opacity=Math.max(0,p.life/p.maxLife);
      if(p.life<=0){scene.remove(p.mesh);G.particles.splice(i,1);}
    }
    updateMinimap();
  }
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
loop();
</script>
</body>
