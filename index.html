<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>FPS ULTIMATE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#000;font-family:'Courier New',monospace;user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ch-line{position:absolute;background:#0f0;box-shadow:0 0 4px #0f0,0 0 8px #0f0}
.ch-t{left:50%;top:-12px;width:2px;height:8px;transform:translateX(-50%)}
.ch-b{left:50%;bottom:-12px;width:2px;height:8px;transform:translateX(-50%)}
.ch-l{left:-12px;top:50%;width:8px;height:2px;transform:translateY(-50%)}
.ch-r{right:-12px;top:50%;width:8px;height:2px;transform:translateY(-50%)}
.ch-dot{position:absolute;left:50%;top:50%;width:3px;height:3px;background:#0f0;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px #0f0}
.hit-marker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .1s}
.hit-marker.show{opacity:1}
.hit-marker div{position:absolute;width:12px;height:2px;background:#fff}
.hm-1{transform:rotate(45deg) translateX(4px)}
.hm-2{transform:rotate(-45deg) translateX(4px)}
.hm-3{transform:rotate(225deg) translateX(4px)}
.hm-4{transform:rotate(-225deg) translateX(4px)}
#panel-tl{position:absolute;left:15px;top:15px;font-size:12px;color:#fff;text-shadow:0 0 4px #000;background:rgba(0,0,0,.4);padding:10px 14px;border-radius:6px;border:1px solid rgba(0,255,0,.2)}
#panel-tr{position:absolute;right:15px;top:15px;font-size:13px;color:#fff;text-shadow:0 0 4px #000;background:rgba(0,0,0,.4);padding:10px 14px;border-radius:6px;border:1px solid rgba(0,255,0,.2);text-align:right}
#health-area{position:absolute;left:15px;bottom:15px;display:flex;gap:10px;align-items:flex-end}
.bar-container{width:180px}
.bar-label{font-size:10px;color:#aaa;margin-bottom:3px;text-shadow:0 0 3px #000}
.bar-bg{height:14px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;transition:width .3s;border-radius:2px}
#hp-fill{background:linear-gradient(90deg,#f00,#f80)}
#armor-fill{background:linear-gradient(90deg,#08f,#0cf)}
.bar-text{position:absolute;width:100%;text-align:center;font-size:9px;line-height:14px;color:#fff;text-shadow:0 0 2px #000}
#ammo-area{position:absolute;right:15px;bottom:15px;text-align:right}
#weapon-name{font-size:12px;color:#0f0;margin-bottom:4px;text-shadow:0 0 4px #0f0}
#ammo-display{font-size:28px;font-weight:bold;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.5)}
#ammo-display span{font-size:16px;color:#888}
#weapon-slots{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.w-slot{width:50px;height:36px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888;flex-direction:column;transition:all .2s}
.w-slot.active{border-color:#0f0;color:#0f0;background:rgba(0,255,0,.1);box-shadow:0 0 8px rgba(0,255,0,.3)}
.w-slot .key{font-size:8px;color:#666}
#wave-banner{position:absolute;left:50%;top:80px;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
#wave-banner.show{opacity:1}
#wave-banner h2{font-size:32px;color:#f80;text-shadow:0 0 10px #f80;margin:0}
#wave-banner p{font-size:14px;color:#fff;text-shadow:0 0 5px #000}
#kill-feed{position:absolute;right:15px;top:60px;font-size:11px;text-align:right}
.kill-msg{color:#ff0;text-shadow:0 0 3px #000;animation:fadeOut 3s forwards;margin:2px 0}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#minimap{position:absolute;right:15px;bottom:80px;width:140px;height:140px;border:2px solid rgba(0,255,0,.3);border-radius:6px;overflow:hidden;background:rgba(0,0,0,.5)}
#minimap canvas{width:100%;height:100%}
#damage-flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .15s;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.4) 100%)}
#heal-flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,255,0,.2) 100%)}
#lock-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:100;flex-direction:column}
#lock-screen.hidden{display:none}
#lock-screen h1{font-size:48px;color:#0f0;text-shadow:0 0 20px #0f0;margin-bottom:20px;letter-spacing:4px}
#lock-screen .subtitle{color:#888;font-size:14px;margin-bottom:30px}
#lock-screen .controls{color:#aaa;font-size:13px;line-height:2;text-align:center;margin-bottom:30px}
#lock-screen .start-btn{padding:15px 50px;font-size:18px;background:transparent;border:2px solid #0f0;color:#0f0;cursor:pointer;border-radius:4px;transition:all .2s;font-family:inherit}
#lock-screen .start-btn:hover{background:rgba(0,255,0,.1);box-shadow:0 0 20px rgba(0,255,0,.3)}
#debug-info{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:10px;color:#ff0;display:none;background:rgba(0,0,0,.5);padding:8px;border-radius:4px}
.scope-overlay{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle at center,transparent 30%,#000 31%)}
.scope-overlay.active{opacity:1}
.scope-cross{position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(0,0,0,.8)}
.scope-cross-h{position:absolute;top:50%;left:0;height:1px;width:100%;background:rgba(0,0,0,.8)}
</style>
</head>
<body>
<div id="hud">

</div>
<div id="damage-flash"></div>

<div class="scope-overlay" id="scope"><div class="scope-cross"></div><div class="scope-cross-h"></div></div>

  <div class="controls">
    WASD - 移动 | SHIFT - 加速 | SPACE - 跳跃<br>
    鼠标左键 - 射击 | 右键 - 瞄准 | R - 换弹<br>
    1/2/3/4 - 切换武器 | TAB - 调试模式<br>
  </div>
  <button class="start-btn" id="start-btn">开 始 游 戏</button>

<script type="module">
import*as THREE from'three';

// ===== AUDIO =====
const AudioCtx=window.AudioContext||window.webkitAudioContext;
const actx=new AudioCtx();
function playSound(type){
  if(actx.state==='suspended')actx.resume();
  const o=actx.createOscillator();
  const g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime;
  switch(type){
    case'shoot':o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(50,t+.1);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.01,t+.1);o.start(t);o.stop(t+.1);break;
    case'shoot_heavy':o.frequency.setValueAtTime(100,t);o.frequency.exponentialRampToValueAtTime(30,t+.15);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.01,t+.15);o.start(t);o.stop(t+.15);break;
    case'shoot_sniper':o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(50,t+.3);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.01,t+.3);o.start(t);o.stop(t+.3);break;
    case'hit':o.type='square';o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(200,t+.05);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.01,t+.05);o.start(t);o.stop(t+.05);break;
    case'kill':o.type='square';o.frequency.setValueAtTime(600,t);o.frequency.setValueAtTime(900,t+.05);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.01,t+.15);o.start(t);o.stop(t+.15);break;
    case'reload':o.type='triangle';o.frequency.setValueAtTime(300,t);o.frequency.setValueAtTime(500,t+.1);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.01,t+.2);o.start(t);o.stop(t+.2);break;
    case'explosion':o.type='sawtooth';o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(20,t+.5);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.01,t+.5);o.start(t);o.stop(t+.5);break;
    case'pickup':o.type='sine';o.frequency.setValueAtTime(400,t);o.frequency.setValueAtTime(600,t+.05);o.frequency.setValueAtTime(800,t+.1);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.01,t+.2);o.start(t);o.stop(t+.2);break;
    case'damage':o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(50,t+.2);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.01,t+.2);o.start(t);o.stop(t+.2);break;
  }
}

// ===== GAME STATE =====
const G={
  debug:false,locked:false,
  hp:100,maxHp:100,armor:0,maxArmor:100,
  kills:0,wave:0,enemiesAlive:0,enemiesTotal:0,
  weapons:[
    {name:'PISTOL',ammo:12,maxAmmo:12,reserve:48,dmg:25,rate:300,auto:false,spread:.02,recoil:.03,sound:'shoot'},
    {name:'ASSAULT RIFLE',ammo:30,maxAmmo:30,reserve:120,dmg:15,rate:100,auto:true,spread:.03,recoil:.02,sound:'shoot'},
    {name:'SHOTGUN',ammo:8,maxAmmo:8,reserve:32,dmg:10,rate:800,auto:false,spread:.08,recoil:.06,pellets:8,sound:'shoot_heavy'},
    {name:'SNIPER',ammo:5,maxAmmo:5,reserve:20,dmg:100,rate:1200,auto:false,spread:.001,recoil:.1,sound:'shoot_sniper',scope:true}
  ],
  curWeapon:1,
  lastShot:0,reloading:false,
  yaw:0,pitch:0,
  scoped:false,
  player:{pos:new THREE.Vector3(0,1.7,30),vel:new THREE.Vector3(),onGround:false,h:1.7,r:.4,spd:5,sprint:1.6,jumpV:7},
  particles:[],
  pickups:[],
  enemyList:[]
};

// ===== DOM =====
const $=id=>document.getElementById(id);
function updateUI(){
  const w=G.weapons[G.curWeapon];
  $('hp-fill').style.width=(G.hp/G.maxHp*100)+'%';
  $('hp-text').textContent=Math.ceil(G.hp);
  $('armor-fill').style.width=(G.armor/G.maxArmor*100)+'%';
  $('armor-text').textContent=Math.ceil(G.armor);
  $('ammo-cur').textContent=w.ammo;
  $('ammo-res').textContent=w.reserve;
  $('weapon-name').textContent=w.name;
  $('kills').textContent=G.kills;
  $('wave').textContent=G.wave;
  $('enemies').textContent=G.enemiesAlive;
  document.querySelectorAll('.w-slot').forEach((s,i)=>{
    s.classList.toggle('active',i===G.curWeapon);
  });
}
function showHitmarker(){
  const hm=$('hitmarker');
  hm.classList.add('show');
  setTimeout(()=>hm.classList.remove('show'),100);
}
function addKillMsg(msg){
  const d=document.createElement('div');
  d.className='kill-msg';d.textContent=msg;
  $('kill-feed').appendChild(d);
  setTimeout(()=>d.remove(),3000);
}
function flashDamage(){
  const f=$('damage-flash');f.style.opacity='1';
  setTimeout(()=>f.style.opacity='0',200);
}
function flashHeal(){
  const f=$('heal-flash');f.style.opacity='1';
  setTimeout(()=>f.style.opacity='0',300);
}

// ===== THREE SETUP =====
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1a2e);
scene.fog=new THREE.FogExp2(0x1a1a2e,.008);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

// Lights
const amb=new THREE.AmbientLight(0x404060,.6);scene.add(amb);
const sun=new THREE.DirectionalLight(0xffeedd,1.5);
sun.position.set(40,60,30);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);
sun.shadow.camera.left=-70;sun.shadow.camera.right=70;
sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;
sun.shadow.camera.far=200;sun.shadow.bias=-.001;
scene.add(sun);
const hemi=new THREE.HemisphereLight(0x8888ff,0x443322,.4);scene.add(hemi);
// 点光源装饰
const pl1=new THREE.PointLight(0xff4400,.8,20);pl1.position.set(-20,4,-20);scene.add(pl1);
const pl2=new THREE.PointLight(0x0044ff,.8,20);pl2.position.set(20,4,20);scene.add(pl2);

// ===== MAP GENERATION =====
const colliders=[];
function addCollider(mesh){
  const box=new THREE.Box3().setFromObject(mesh);
  colliders.push(box);
}
function makeTex(w,h,fn){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');fn(ctx,w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

// Ground
const groundTex=makeTex(512,512,(ctx)=>{
  ctx.fillStyle='#2a3a2a';ctx.fillRect(0,0,512,512);
  for(let i=0;i<8000;i++){
    const s=40+Math.random()*20;
    ctx.fillStyle=`rgb(${s},${s+15},${s})`;
    ctx.fillRect(Math.random()*512,Math.random()*512,2,2);
  }
  ctx.strokeStyle='#1a2a1a';ctx.lineWidth=1;
  for(let i=0;i<=512;i+=32){
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,512);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(512,i);ctx.stroke();
  }
});
groundTex.repeat.set(20,20);
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({map:groundTex,roughness:.95})
);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
addCollider(ground);

// Walls
const wallTex=makeTex(256,256,(ctx)=>{
  ctx.fillStyle='#3a3a4a';ctx.fillRect(0,0,256,256);
  for(let y=0;y<256;y+=32){
    ctx.strokeStyle='#2a2a3a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(256,y);ctx.stroke();
    const off=(y/32)%2?16:0;
    for(let x=off;x<256;x+=64){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+32);ctx.stroke();}
  }
});
wallTex.repeat.set(8,2);
const wallMat=new THREE.MeshStandardMaterial({map:wallTex,roughness:.8});
function makeWall(x,y,z,w,h,d,ry=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);
  m.position.set(x,y,z);m.rotation.y=ry;
  m.castShadow=true;m.receiveShadow=true;scene.add(m);addCollider(m);return m;
}
// 外围墙
makeWall(0,3,-60,120,6,1);
makeWall(0,3,60,120,6,1);
makeWall(-60,3,0,1,6,120,0);
makeWall(60,3,0,1,6,120,0);

// Buildings
const bldTex=makeTex(512,512,(ctx)=>{
  ctx.fillStyle='#4a4a5a';ctx.fillRect(0,0,512,512);
  ctx.fillStyle='#2a3a5a';
  for(let y=30;y<480;y+=70)for(let x=30;x<480;x+=90)ctx.fillRect(x,y,50,50);
  ctx.fillStyle='#1a2a3a';
  for(let y=30;y<480;y+=70)for(let x=30;x<480;x+=90){
    if(Math.random()>.3)ctx.fillRect(x+5,y+5,40,40);
  }
});
function makeBuilding(x,z,w,h,d){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({map:bldTex,roughness:.7}));
  body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;g.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.5,.4,d+.5),new THREE.MeshStandardMaterial({color:0x222222,roughness:.9}));
  roof.position.y=h+.2;roof.castShadow=true;g.add(roof);
  g.position.set(x,0,z);scene.add(g);addCollider(body);
  return g;
}
makeBuilding(-30,-30,14,8,14);
makeBuilding(30,-30,14,8,14);
makeBuilding(-30,30,14,8,14);
makeBuilding(30,30,14,8,14);
makeBuilding(-30,0,10,6,20);
makeBuilding(30,0,10,6,20);
makeBuilding(0,-30,20,6,10);
makeBuilding(0,30,20,6,10);

// Cover objects
const crateTex=makeTex(128,128,(ctx)=>{
  ctx.fillStyle='#6a5030';ctx.fillRect(0,0,128,128);
  ctx.strokeStyle='#3a2a10';ctx.lineWidth=4;
  ctx.strokeRect(2,2,124,124);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(128,128);ctx.stroke();
  ctx.beginPath();ctx.moveTo(128,0);ctx.lineTo(0,128);ctx.stroke();
});
function makeCrate(x,z,s=1.5){
  const m=new THREE.Mesh(new THREE.BoxGeometry(s,s,s),new THREE.MeshStandardMaterial({map:crateTex,roughness:.85}));
  m.position.set(x,s/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);addCollider(m);return m;
}
[[-5,-5],[5,-5],[-5,5],[5,5],[0,-10],[0,10],[-10,0],[10,0],
 [-15,-15],[15,-15],[-15,15],[15,15],[-20,5],[20,-5],[5,-20],[-5,20]
].forEach(([x,z])=>makeCrate(x,z));

// Barrels
function makeBarrel(x,z){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,1.1,16),new THREE.MeshStandardMaterial({color:0xcc2222,roughness:.5,metalness:.3}));
  body.position.y=.55;body.castShadow=true;g.add(body);
  const ring1=new THREE.Mesh(new THREE.TorusGeometry(.41,.03,8,16),new THREE.MeshStandardMaterial({color:0x333333,metalness:.8}));
  ring1.rotation.x=Math.PI/2;ring1.position.y=.3;g.add(ring1);
  const ring2=ring1.clone();ring2.position.y=.8;g.add(ring2);
  g.position.set(x,0,z);scene.add(g);
  g.userData={type:'barrel',hp:1,onHit:()=>{explode(g.position);scene.remove(g);G.kills++;addKillMsg('💥 油桶爆炸!');playSound('explosion');updateUI();}};
  return g;
}
const barrels=[];

// ===== ENEMY SYSTEM =====
function createEnemy(x,z,type='normal'){
  const g=new THREE.Group();
  const cfg={
    normal:{hp:2,spd:.03,color:0x44aa44,size:1},
    fast:{hp:1,spd:.06,color:0xaa44aa,size:.8},
    heavy:{hp:5,spd:.02,color:0x4444aa,size:1.4},
    boss:{hp:20,spd:.015,color:0xaa2222,size:2}
  };
  const c=cfg[type]||cfg.normal;
  const s=c.size;
  const mat=new THREE.MeshStandardMaterial({color:c.color,roughness:.7});
  const matDark=new THREE.MeshStandardMaterial({color:0x111111});
  // Body
  const body=new THREE.Mesh(new THREE.BoxGeometry(.6*s,.8*s,.35*s),mat);
  body.position.y=1.2*s;body.castShadow=true;g.add(body);
  // Head
  const head=new THREE.Mesh(new THREE.BoxGeometry(.35*s,.35*s,.35*s),mat);
  head.position.y=1.8*s;head.castShadow=true;g.add(head);
  // Eyes (glowing)
  const eyeMat=new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:2});
  const eL=new THREE.Mesh(new THREE.BoxGeometry(.06*s,.06*s,.02*s),eyeMat);
  eL.position.set(-.08*s,1.85*s,.19*s);g.add(eL);
  const eR=new THREE.Mesh(new THREE.BoxGeometry(.06*s,.06*s,.02*s),eyeMat);
  eR.position.set(.08*s,1.85*s,.19*s);g.add(eR);
  // Arms
  const armGeo=new THREE.BoxGeometry(.15*s,.7*s,.15*s);
  const aL=new THREE.Mesh(armGeo,mat);aL.position.set(-.4*s,1.1*s,0);aL.castShadow=true;g.add(aL);
  const aR=new THREE.Mesh(armGeo,mat);aR.position.set(.4*s,1.1*s,0);aR.castShadow=true;g.add(aR);
  // Legs
  const legGeo=new THREE.BoxGeometry(.2*s,.7*s,.2*s);
  const lL=new THREE.Mesh(legGeo,matDark);lL.position.set(-.15*s,.35*s,0);lL.castShadow=true;g.add(lL);
  const lR=new THREE.Mesh(legGeo,matDark);lR.position.set(.15*s,.35*s,0);lR.castShadow=true;g.add(lR);
  
  g.position.set(x,0,z);
  g.userData={type,hp:c.hp,maxHp:c.hp,spd:c.spd,alive:true,t:Math.random()*6.28,aL,aR,lL,lR,body};
  scene.add(g);
  G.enemyList.push(g);
  return g;
}

function spawnParticles(pos,color,count=10,speed=5,life=1){

      new THREE.BoxGeometry(.08,.08,.08),
      new THREE.MeshBasicMaterial({color})
    );
    s.position.copy(pos);
    const vel=new THREE.Vector3((Math.random()-.5)*speed,Math.random()*speed,(Math.random()-.5)*speed);
    G.particles.push({mesh:s,vel,life,maxLife:life});
    scene.add(s);
  }
}
function explode(pos){
  spawnParticles(pos,0xff6600,20,8,1.5);
  spawnParticles(pos,0xffaa00,10,6,1);
  spawnParticles(pos,0x333333,10,4,2);
  const light=new THREE.PointLight(0xff8800,10,15);
  light.position.copy(pos);scene.add(light);
  setTimeout(()=>scene.remove(light),200);
  // Damage nearby enemies
  G.enemyList.forEach(e=>{
    if(e.userData.alive&&e.position.distanceTo(pos)<5){
      e.userData.hp-=5;
      if(e.userData.hp<=0)killEnemy(e);
    }
  });
}
function killEnemy(e){
  if(!e.userData.alive)return;
  e.userData.alive=false;
  G.kills++;G.enemiesAlive--;
  addKillMsg('☠️ 击杀 '+e.userData.type);
  playSound('kill');
  spawnParticles(e.position.clone().add(new THREE.Vector3(0,1,0)),0xff0000,15,4,1);
  // Death animation
  const start=performance.now();
  const anim=()=>{
    const t=(performance.now()-start)/600;
    e.rotation.x=t*Math.PI/2;
    e.position.y=-t*.5;
    if(t<1)requestAnimationFrame(anim);
    else{scene.remove(e);}
  };
  anim();
  // Drop pickup
  if(Math.random()<.3){
    const types=['health','ammo','armor'];
    createPickup(e.position.x,e.position.z,types[Math.floor(Math.random()*types.length)]);
  }
  updateUI();
  checkWave();
}

function startWave(){
  G.wave++;
  G.enemiesTotal=5+G.wave*3;
  G.enemiesAlive=G.enemiesTotal;
  // Banner
  const wb=$('wave-banner');
  wb.querySelector('h2').textContent='WAVE '+G.wave;

    setTimeout(()=>{
      const angle=Math.random()*Math.PI*2;
      const dist=25+Math.random()*25;
      const x=Math.cos(angle)*dist;
      const z=Math.sin(angle)*dist;
      let type='normal';
      const r=Math.random();
      if(G.wave>=2&&r<.2)type='fast';
      if(G.wave>=3&&r<.15)type='heavy';
      if(G.wave>=5&&i===G.enemiesTotal-1)type='boss';
      createEnemy(x,z,type);
    },i*400);
  }
  // Spawn pickups
  for(let i=0;i<3;i++){

    const dist=10+Math.random()*20;
    createPickup(Math.cos(angle)*dist,Math.sin(angle)*dist,['health','ammo','armor'][Math.floor(Math.random()*3)]);
  }
  updateUI();

function checkWave(){
  if(G.enemiesAlive<=0&&G.wave>0){
    setTimeout(()=>{startWave();},2000);
  }
}

// ===== SHOOTING =====
function shoot(){
  const w=G.weapons[G.curWeapon];
  const now=performance.now();
  if(now-G.lastShot<w.rate||G.reloading)return;
  if(w.ammo<=0){reload();return;}
  G.lastShot=now;
  w.ammo--;
  playSound(w.sound);
  updateUI();
  
  // Recoil
  weaponGroup.position.z+=w.recoil;
  weaponGroup.rotation.x-=w.recoil*2;
  G.pitch+=w.recoil*.5;
  
  // Muzzle flash
  const flash=new THREE.PointLight(0xffaa00,3,5);
  flash.position.copy(camera.position).add(new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion));
  scene.add(flash);
  setTimeout(()=>scene.remove(flash),50);
  
  // Raycast
  const pellets=w.pellets||1;
  for(let p=0;p<pellets;p++){
    const spread=w.spread*(G.scoped?.2:1);
    const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    dir.x+=(Math.random()-.5)*spread;
    dir.y+=(Math.random()-.5)*spread;
    dir.z+=(Math.random()-.5)*spread;
    dir.normalize();
    const ray=new THREE.Raycaster(camera.position.clone(),dir,0,150);
    // Check enemies
    let hit=false;
    for(const e of G.enemyList){
      if(!e.userData.alive)continue;
      const intersects=ray.intersectObject(e,true);
      if(intersects.length>0&&intersects[0].distance<150){
        hit=true;
        e.userData.hp-=w.dmg;
        showHitmarker();
        playSound('hit');
        spawnParticles(intersects[0].point,0xff4444,3,2,.5);
        if(e.userData.hp<=0)killEnemy(e);
        else{
          e.userData.body.material.emissive.setHex(0xff0000);
          setTimeout(()=>{if(e.userData.alive)e.userData.body.material.emissive.setHex(0);},100);
        }
        break;
      }
    }
    // Check barrels
    if(!hit){
      for(const b of barrels){
        if(!b.parent)continue;
        const intersects=ray.intersectObject(b,true);
        if(intersects.length>0){
          b.userData.onHit();
          barrels.splice(barrels.indexOf(b),1);
          hit=true;break;
        }
      }
    }
  }
}
function reload(){
  const w=G.weapons[G.curWeapon];
  if(w.ammo>=w.maxAmmo||w.reserve<=0)return;
  G.reloading=true;
  playSound('reload');
  setTimeout(()=>{
    const need=w.maxAmmo-w.ammo;
    const load=Math.min(need,w.reserve);
    w.ammo+=load;w.reserve-=load;
    G.reloading=false;updateUI();
  },1500);
}

// ===== PLAYER MOVEMENT =====
function updatePlayer(dt){
  camera.rotation.order='YXZ';
  camera.rotation.set(G.pitch,G.yaw,0);
  const p=G.player;
  const spd=p.spd*(keys.ShiftLeft?p.sprint:1);
  const fwd=new THREE.Vector3(-Math.sin(G.yaw),0,-Math.cos(G.yaw));
  const right=new THREE.Vector3(Math.cos(G.yaw),0,-Math.sin(G.yaw));
  const move=new THREE.Vector3();
  if(keys.KeyW)move.add(fwd);
  if(keys.KeyS)move.sub(fwd);
  if(keys.KeyD)move.add(right);
  if(keys.KeyA)move.sub(right);
  if(move.lengthSq()>0)move.normalize();
  
  if(G.debug){
    const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    const v=new THREE.Vector3();
    if(move.lengthSq()>0)v.addScaledVector(move,spd*2);
    if(keys.Space)v.y+=spd*2;
    if(keys.ShiftLeft)v.y-=spd*2;
    p.pos.addScaledVector(v,dt);
    p.vel.set(0,0,0);
  }else{
    p.vel.x=move.x*spd;
    p.vel.z=move.z*spd;
    p.vel.y-=22*dt;
    if(keys.Space&&p.onGround){p.vel.y=p.jumpV;p.onGround=false;}
    // Collision
    const np=p.pos.clone();
    np.x+=p.vel.x*dt;
    if(!collides(np))p.pos.x=np.x;
    np.z+=p.vel.z*dt;
    if(!collides(np))p.pos.z=np.z;
    np.y+=p.vel.y*dt;
    if(collides(np)){
      if(p.vel.y<0)p.onGround=true;
      p.vel.y=0;
    }else{p.pos.y=np.y;p.onGround=false;}
    if(p.pos.y<-10){p.pos.set(0,5,30);p.vel.set(0,0,0);}
  }
  camera.position.copy(p.pos);
  
  // Weapon bob & recoil recovery
  weaponGroup.position.z=THREE.MathUtils.lerp(weaponGroup.position.z,-.5,dt*8);
  weaponGroup.rotation.x=THREE.MathUtils.lerp(weaponGroup.rotation.x,0,dt*8);
  const bob=Math.sin(performance.now()*.005)*((move.lengthSq()>0)?.005:0);
  weaponGroup.position.y=-.22+bob;
  
  // Auto fire
  if(mouseDown&&G.locked){
    const w=G.weapons[G.curWeapon];
    if(w.auto)shoot();
  }
  
  // Pickup collision
  for(let i=G.pickups.length-1;i>=0;i--){
    const pk=G.pickups[i];
    if(pk.userData.alive&&pk.position.distanceTo(p.pos)<1.5){
      pk.userData.alive=false;
      scene.remove(pk);G.pickups.splice(i,1);
      playSound('pickup');
      if(pk.userData.type==='health'){G.hp=Math.min(G.maxHp,G.hp+30);flashHeal();}
      if(pk.userData.type==='ammo'){G.weapons.forEach(w=>w.reserve+=w.maxAmmo);}
      if(pk.userData.type==='armor'){G.armor=Math.min(G.maxArmor,G.armor+30);}
      updateUI();
    }
  }
}
function collides(pos){
  const r=G.player.r;
  const pBox=new THREE.Box3(
    new THREE.Vector3(pos.x-r,pos.y-G.player.h,pos.z-r),
    new THREE.Vector3(pos.x+r,pos.y+.1,pos.z+r)
  );
  for(const c of colliders){
    if(c.intersectsBox(pBox))return true;
  }
  return false;
}

// ===== ENEMY AI =====
function updateEnemies(dt){
  const pPos=G.player.pos;
  for(const e of G.enemyList){
    if(!e.userData.alive)continue;
    const d=e.userData;
    d.t+=dt*3;
    // Animate
    d.aL.rotation.x=Math.sin(d.t)*.4;
    d.aR.rotation.x=-Math.sin(d.t)*.4;
    d.lL.rotation.x=-Math.sin(d.t)*.3;
    d.lR.rotation.x=Math.sin(d.t)*.3;
    // Move towards player
    const toPlayer=new THREE.Vector3().subVectors(pPos,e.position);
    toPlayer.y=0;
    const dist=toPlayer.length();
    if(dist>2){
      toPlayer.normalize();
      e.position.addScaledVector(toPlayer,d.spd);
      e.rotation.y=Math.atan2(toPlayer.x,toPlayer.z);
    }else{
      // Attack player
      if(Math.random()<.02){
        const dmg=d.type==='boss'?15:d.type==='heavy'?10:5;
        takeDamage(dmg);
      }
    }
  }
}
function takeDamage(dmg){
  if(G.armor>0){
    const absorbed=Math.min(G.armor,dmg*.7);
    G.armor-=absorbed;
    dmg-=absorbed;
  }
  G.hp-=dmg;
  flashDamage();
  playSound('damage');
  if(G.hp<=0){
    G.hp=G.maxHp;G.armor=0;
    G.player.pos.set(0,1.7,30);
    addKillMsg('💀 你被击杀了！重生...');
  }
  updateUI();
}

// ===== MINIMAP =====
const mmCtx=$('mm-canvas').getContext('2d');
function drawMinimap(){
  mmCtx.fillStyle='rgba(0,0,0,.6)';
  mmCtx.fillRect(0,0,140,140);
  const s=1.1,cx=70,cy=70;
  // Colliders
  mmCtx.fillStyle='#333';
  for(const c of colliders){
    const x=cx+(c.min.x+c.max.x)/2*s;
    const y=cy+(c.min.z+c.max.z)/2*s;
    const w=(c.max.x-c.min.x)*s;
    const h=(c.max.z-c.min.z)*s;
    if(x>-10&&x<150&&y>-10&&y<150)mmCtx.fillRect(x-w/2,y-h/2,Math.max(w,2),Math.max(h,2));
  }
  // Enemies
  mmCtx.fillStyle='#f00';
  for(const e of G.enemyList){
    if(!e.userData.alive)continue;
    const x=cx+e.position.x*s;
    const y=cy+e.position.z*s;
    if(x>0&&x<140&&y>0&&y<140){
      mmCtx.beginPath();mmCtx.arc(x,y,3,0,6.28);mmCtx.fill();
    }
  }
  // Pickups
  mmCtx.fillStyle='#0f0';
  for(const pk of G.pickups){
    if(!pk.userData.alive)continue;
    const x=cx+pk.position.x*s;
    const y=cy+pk.position.z*s;
    if(x>0&&x<140&&y>0&&y<140)mmCtx.fillRect(x-2,y-2,4,4);
  }
  // Player
  mmCtx.fillStyle='#0f0';
  const px=cx+G.player.pos.x*s;
  const py=cy+G.player.pos.z*s;
  mmCtx.beginPath();mmCtx.arc(px,py,4,0,6.28);mmCtx.fill();
  mmCtx.strokeStyle='#0f0';mmCtx.lineWidth=2;
  mmCtx.beginPath();mmCtx.moveTo(px,py);
  mmCtx.lineTo(px-Math.sin(G.yaw)*10,py-Math.cos(G.yaw)*10);
  mmCtx.stroke();
}

// ===== DEBUG INFO =====
function updateDebug(){
  if(!G.debug)return;
  $('debug-info').innerHTML=
    `POS: ${G.player.pos.x.toFixed(1)}, ${G.player.pos.y.toFixed(1)}, ${G.player.pos.z.toFixed(1)}<br>`+
    `YAW: ${G.yaw.toFixed(2)} PITCH: ${G.pitch.toFixed(2)}<br>`+
    `VEL: ${G.player.vel.length().toFixed(1)}<br>`+
    `GROUNDED: ${G.player.onGround}`;
}

// ===== MAIN LOOP =====
let last=performance.now(),fpsA=0,fpsF=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  
  if(G.locked){
    updatePlayer(dt);
    updateEnemies(dt);
    // Single fire weapons
    if(mouseDown&&!G.weapons[G.curWeapon].auto)shoot();
  }
  
  // Update particles
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];
    p.life-=dt;
    p.vel.y-=10*dt;
    p.mesh.position.addScaledVector(p.vel,dt);
    p.mesh.material.opacity=p.life/p.maxLife;
    if(p.life<=0){scene.remove(p.mesh);G.particles.splice(i,1);}
  }
  
  renderer.render(scene,camera);
  drawMinimap();
  updateDebug();
  
  fpsA+=dt;fpsF++;
  if(fpsA>=.5){
    $('fps').textContent=Math.round(fpsF/fpsA)+' FPS';
    fpsA=0;fpsF=0;
  }
}

// ===== START =====
updateUI();
startWave();
requestAnimationFrame(loop);
</script>
