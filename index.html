<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>FPS Game - 完整版</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: monospace; color: #fff; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 24px; height: 24px; }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: #0f0; box-shadow: 0 0 6px #0f0;
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #crosshair-dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
    background: #0f0; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 4px #0f0; }
  
  #info { position: absolute; left: 10px; top: 10px; font-size: 13px; line-height: 1.6;
    text-shadow: 0 0 3px #000; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 4px; }
  #debug { color: #ff0; display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid #444; }
  
  #stats-panel { position: absolute; right: 10px; top: 10px; font-size: 14px;
    text-shadow: 0 0 3px #000; background: rgba(0,0,0,0.3); padding: 10px 14px; border-radius: 4px; }
  #stats-panel > div { margin: 4px 0; }
  
  #health-bar { position: absolute; left: 10px; bottom: 10px; width: 200px; }
  #health-bar-bg { width: 100%; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid #333; border-radius: 3px; }
  #health-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #f60); transition: width 0.3s; }
  #health-text { position: absolute; width: 100%; text-align: center; line-height: 20px; font-size: 12px;
    text-shadow: 0 0 3px #000; }
  
  #ammo { position: absolute; right: 10px; bottom: 10px; font-size: 24px; font-weight: bold;
    text-shadow: 0 0 5px #000; background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 4px; }
  
  #wave-info { position: absolute; left: 50%; top: 60px; transform: translateX(-50%);
    font-size: 18px; text-shadow: 0 0 5px #000; background: rgba(0,0,0,0.5);
    padding: 10px 20px; border-radius: 4px; display: none; }
  
  #minimap { position: absolute; right: 10px; bottom: 60px; width: 150px; height: 150px;
    background: rgba(0,0,0,0.5); border: 2px solid #0f0; border-radius: 4px; }
  #minimap-canvas { width: 100%; height: 100%; }
  
  #errors { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); max-width: 300px;
    font-size: 11px; color: #f66; text-align: right; text-shadow: 0 0 3px #000; }
  
  #lock { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8); padding: 30px 50px; border: 2px solid #0f0; font-size: 18px;
    text-align: center; border-radius: 8px; }
  #lock.hidden { display: none; }
  #lock h2 { margin: 0 0 15px; color: #0f0; }
  #lock small { color: #aaa; }
  
  #damage-overlay { position: fixed; inset: 0; background: radial-gradient(circle, transparent 30%, rgba(255,0,0,0.3));
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
</style>
</head>
<body>
<div id="hud">
  <div id="crosshair"><div id="crosshair-dot"></div></div>
  
  <div id="info">
    <div><b>FPS Game - 完整版</b></div>
    <div>WASD 移动 / 空格 跳跃 / 鼠标 射击</div>
    <div>R 换弹 / Tab 调试模式</div>
    <div id="debug">[DEBUG MODE] 无重力 / 自由飞行</div>
  </div>
  
  <div id="stats-panel">
    <div>击杀: <span id="kills">0</span></div>
    <div>波次: <span id="wave">1</span></div>
    <div>剩余: <span id="enemies-left">0</span></div>
    <div id="fps">FPS: 0</div>
  </div>
  
  <div id="health-bar">
    <div id="health-bar-bg">
      <div id="health-bar-fill"></div>
      <div id="health-text">100 / 100</div>
    </div>
  </div>
  
  <div id="ammo">
    <span id="ammo-current">30</span> / <span id="ammo-reserve">90</span>
  </div>
  
  <div id="wave-info">
    <div>第 <span id="wave-num">1</span> 波</div>
    <div>消灭所有敌人！</div>
  </div>
  
  <div id="minimap">
    <canvas id="minimap-canvas" width="150" height="150"></canvas>
  </div>
  
  <div id="errors"></div>
  
  <div id="lock">
    <h2>🎮 FPS Game</h2>
    <div>点击屏幕开始游戏</div>
    <small>ESC 暂停</small>
  </div>
</div>

<div id="damage-overlay"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}

<script type="module">
import * as THREE from 'three';
window.THREE = THREE;

// ============ 模型注册表 ============
const MODEL_REGISTRY = {
  'models/floor.js': (params = {}) => {
    const size = params.size || 100;
    const geo = new THREE.PlaneGeometry(size, size, 20, 20);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 512;
    const ctx = canvas.getContext('2d');
    // 更复杂的地面纹理
    ctx.fillStyle = '#3a4a3a';
    ctx.fillRect(0, 0, 512, 512);
    // 添加噪点
    for (let i = 0; i < 5000; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const shade = 50 + Math.random() * 30;
      ctx.fillStyle = `rgb(${shade},${shade+10},${shade})`;
      ctx.fillRect(x, y, 2, 2);
    }
    // 网格线
    ctx.strokeStyle = '#2a3a2a';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 512; i += 32) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(size/10, size/10);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.receiveShadow = true;
    return mesh;
  },

  'models/wall.js': (params = {}) => {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 256;
    const ctx = canvas.getContext('2d');
    // 砖墙纹理
    ctx.fillStyle = '#8a7a6a';
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = '#5a4a3a';
    ctx.lineWidth = 3;
    for (let y = 0; y < 256; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      const offset = (y/32) % 2 === 0 ? 0 : 64;
      for (let x = offset; x < 256; x += 128) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+32); ctx.stroke();
      }
    }
    // 添加一些污渍
    for (let i = 0; i < 20; i++) {
      ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.2})`;
      ctx.beginPath();
      ctx.arc(Math.random()*256, Math.random()*256, Math.random()*20+5, 0, Math.PI*2);
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(4, 2);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  },

  'models/building.js': (params = {}) => {
    const group = new THREE.Group();
    const w = params.width || 8;
    const h = params.height || 4;
    const d = params.depth || 8;
    
    // 主体
    const bodyGeo = new THREE.BoxGeometry(w, h, d);
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#6a5a4a';
    ctx.fillRect(0, 0, 512, 256);
    // 窗户
    ctx.fillStyle = '#2a3a4a';
    for (let y = 40; y < 220; y += 60) {
      for (let x = 40; x < 480; x += 80) {
        ctx.fillRect(x, y, 40, 50);
      }
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    const bodyMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = h/2;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);
    
    // 屋顶
    const roofGeo = new THREE.BoxGeometry(w+0.5, 0.3, d+0.5);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.9 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = h + 0.15;
    roof.castShadow = true;
    group.add(roof);
    
    return group;
  },

  'models/box.js': (params = {}) => {
    const size = params.size || 1;
    const geo = new THREE.BoxGeometry(size, size, size);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#a07040';
    ctx.fillRect(0, 0, 256, 256);
    // 木板纹理
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 4;
    for (let y = 0; y < 256; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
    }
    // 边框和加固
    ctx.strokeStyle = '#3a2510';
    ctx.lineWidth = 8;
    ctx.strokeRect(4, 4, 248, 248);
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(256,256);
    ctx.moveTo(256,0); ctx.lineTo(0,256);
    ctx.stroke();
    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  },

  'models/barrel.js': (params = {}) => {
    const group = new THREE.Group();
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.3, 20);
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#b02020';
    ctx.fillRect(0, 0, 512, 256);
    ctx.fillStyle = '#f0c020';
    ctx.fillRect(0, 100, 512, 40);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText('DANGER', 160, 130);
    ctx.fillStyle = '#333';
    ctx.fillRect(0, 20, 512, 6);
    ctx.fillRect(0, 230, 512, 6);
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    const bodyMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, metalness: 0.3 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true; body.receiveShadow = true;
    group.add(body);
    const capGeo = new THREE.CylinderGeometry(0.47, 0.47, 0.06, 20);
    const capMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.6 });
    const cap = new THREE.Mesh(capGeo, capMat);
    cap.position.y = 0.68;
    cap.castShadow = true;
    group.add(cap);

    group.userData.onHit = (hit) => {
      const scene = group.parent;
      if (!scene) return;
      const pos = group.getWorldPosition(new THREE.Vector3());
      // 爆炸效果
      for (let i = 0; i < 15; i++) {
        const g = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const m = new THREE.MeshStandardMaterial({ color: Math.random() < 0.5 ? 0xff6600 : 0x333333 });
        const p = new THREE.Mesh(g, m);
        p.position.copy(pos);
        p.userData._vel = new THREE.Vector3(
          (Math.random()-0.5)*8, Math.random()*8, (Math.random()-0.5)*8
        );
        p.userData._life = 1.0;
        scene.add(p);
        const tick = () => {
          p.userData._life -= 0.02;
          p.userData._vel.y -= 0.3;
          p.position.addScaledVector(p.userData._vel, 0.05);
          if (p.userData._life <= 0) { scene.remove(p); return; }
          requestAnimationFrame(tick);
        };
        tick();
      }
      const light = new THREE.PointLight(0xff8800, 8, 12);
      light.position.copy(pos);
      scene.add(light);
      setTimeout(() => scene.remove(light), 200);
      scene.remove(group);
      state.kills++;
      updateHUD();
    };
    return group;
  },

  'models/target.js': (params = {}) => {
    const group = new THREE.Group();
    const poleGeo = new THREE.BoxGeometry(0.12, 1.8, 0.12);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x4a3520 });
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.y = 0.9;
    pole.castShadow = true;
    group.add(pole);
    const discGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.1, 32);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,512,512);
    const colors = ['#fff', '#222', '#2266cc', '#cc2222', '#ffcc00'];
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = colors[i];
      ctx.beginPath();
      ctx.arc(256, 256, 256 - i*50, 0, Math.PI*2);
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(canvas);
    const discMat = new THREE.MeshStandardMaterial({ map: tex });
    const disc = new THREE.Mesh(discGeo, discMat);
    disc.rotation.x = Math.PI / 2;
    disc.position.y = 1.8;
    disc.castShadow = true;
    group.add(disc);

    group.userData.onHit = () => {
      const start = performance.now();
      const tick = () => {
        const t = (performance.now() - start) / 500;
        group.rotation.x = t * Math.PI/2;
        if (t < 1) requestAnimationFrame(tick);
        else setTimeout(() => { group.rotation.x = 0; }, 1500);
      };
      tick();
      state.kills++;
      updateHUD();
    };
    return group;
  },

  'models/enemy.js': (params = {}) => {
    const group = new THREE.Group();
    const type = params.type || 'normal';
    const colors = {
      normal: { skin: 0x88aa66, cloth: 0x334455 },
      fast: { skin: 0xaa6688, cloth: 0x553344 },
      heavy: { skin: 0x6688aa, cloth: 0x445566 }
    };
    const c = colors[type] || colors.normal;
    
    const skin = new THREE.MeshStandardMaterial({ color: c.skin, roughness: 0.8 });
    const cloth = new THREE.MeshStandardMaterial({ color: c.cloth, roughness: 0.9 });
    const dark  = new THREE.MeshStandardMaterial({ color: 0x222222 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), cloth);
    body.position.y = 1.2; body.castShadow = true; group.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), skin);
    head.position.y = 1.9; head.castShadow = true; group.add(head);
    const eyeGeo = new THREE.BoxGeometry(0.08, 0.08, 0.02);
    const eyeL = new THREE.Mesh(eyeGeo, dark);
    eyeL.position.set(-0.1, 1.95, 0.21); group.add(eyeL);
    const eyeR = new THREE.Mesh(eyeGeo, dark);
    eyeR.position.set(0.1, 1.95, 0.21); group.add(eyeR);
    const armGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
    const armL = new THREE.Mesh(armGeo, cloth);
    armL.position.set(-0.45, 1.2, 0); armL.castShadow = true; group.add(armL);
    const armR = new THREE.Mesh(armGeo, cloth);
    armR.position.set(0.45, 1.2, 0); armR.castShadow = true; group.add(armR);
    const legGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
    const legL = new THREE.Mesh(legGeo, dark);
    legL.position.set(-0.18, 0.4, 0); legL.castShadow = true; group.add(legL);
    const legR = new THREE.Mesh(legGeo, dark);
    legR.position.set(0.18, 0.4, 0); legR.castShadow = true; group.add(legR);

    group.userData._t = Math.random() * Math.PI * 2;
    group.userData._type = type;
    group.userData._hp = type === 'heavy' ? 3 : 1;
    group.userData._speed = type === 'fast' ? 0.08 : 0.04;
    
    const baseTick = () => {
      if (!group.parent) return;
      group.userData._t += 0.04;
      armL.rotation.x = Math.sin(group.userData._t) * 0.3;
      armR.rotation.x = -Math.sin(group.userData._t) * 0.3;
      legL.rotation.x = -Math.sin(group.userData._t) * 0.2;
      legR.rotation.x = Math.sin(group.userData._t) * 0.2;
      requestAnimationFrame(baseTick);
    };
    baseTick();

    group.userData.onHit = () => {
      group.userData._hp--;
      if (group.userData._hp <= 0) {
        const start = performance.now();
        const tick = () => {
          const t = (performance.now() - start) / 400;
          group.rotation.x = t * Math.PI/2;
          group.position.y = -t * 0.4;
          if (t < 1) requestAnimationFrame(tick);
          else {
            setTimeout(() => {
              group.rotation.x = 0;
              group.position.y = 0;
              group.userData._hp = group.userData._type === 'heavy' ? 3 : 1;
            }, 3000);
          }
        };
        tick();
        state.kills++;
        state.enemiesKilled++;
        updateHUD();
      } else {
        // 受击闪烁
        const origColor = cloth.color.getHex();
        cloth.color.setHex(0xff0000);
        setTimeout(() => cloth.color.setHex(origColor), 100);
      }
    };
    return group;
  },

  'models/tree.js': (params = {}) => {
    const group = new THREE.Group();
    // 树干
    const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 3, 8);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.9 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 1.5;
    trunk.castShadow = true;
    group.add(trunk);
    // 树冠
    const leavesGeo = new THREE.SphereGeometry(1.5, 12, 10);
    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 0.9 });
    const leaves = new THREE.Mesh(leavesGeo, leavesMat);
    leaves.position.y = 3.5;
    leaves.castShadow = true;
    group.add(leaves);
    return group;
  },

  'models/rock.js': (params = {}) => {
    const geo = new THREE.DodecahedronGeometry(1, 0);
    const mat = new THREE.MeshStandardMaterial({ color: 0x6a6a6a, roughness: 0.95 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }
};

// ============ 大型场景数据 ============
const SCENE_DATA = {

    { id: "building1", model: "models/building.js", position: [-15, 0, -15], params: { width: 10, height: 5, depth: 10 }, collidable: true },

    { id: "cover1", model: "models/box.js", position: [0, 0.75, 0], params: { size: 1.5 }, collidable: true },

    { id: "cover3", model: "models/box.js", position: [3, 0.75, -3], params: { size: 1.5 }, collidable: true },
    { id: "cover4", model: "models/box.js", position: [-3, 0.75, 3], params: { size: 1.5 }, collidable: true },
    { id: "cover5", model: "models/box.js", position: [3, 0.75, 3], params: { size: 1.5 }, collidable: true },
    
    // 油桶
    { id: "barrel1", model: "models/barrel.js", position: [-8, 0.65, -8], destructible: true },
    { id: "barrel2", model: "models/barrel.js", position: [8, 0.65, -8], destructible: true },
    { id: "barrel3", model: "models/barrel.js", position: [-8, 0.65, 8], destructible: true },
    { id: "barrel4", model: "models/barrel.js", position: [8, 0.65, 8], destructible: true },
    { id: "barrel5", model: "models/barrel.js", position: [0, 0.65, -20], destructible: true },
    { id: "barrel6", model: "models/barrel.js", position: [0, 0.65, 20], destructible: true },
    
    // 靶子
    { id: "target1", model: "models/target.js", position: [-20, 1.5, -25], destructible: true },
    { id: "target2", model: "models/target.js", position: [0, 1.5, -25], destructible: true },
    { id: "target3", model: "models/target.js", position: [20, 1.5, -25], destructible: true },
    { id: "target4", model: "models/target.js", position: [-20, 1.5, 25], destructible: true },
    { id: "target5", model: "models/target.js", position: [0, 1.5, 25], destructible: true },
    { id: "target6", model: "models/target.js", position: [20, 1.5, 25], destructible: true },
    
    // 树木装饰
    { id: "tree1", model: "models/tree.js", position: [-30, 0, -30] },
    { id: "tree2", model: "models/tree.js", position: [30, 0, -30] },
    { id: "tree3", model: "models/tree.js", position: [-30, 0, 30] },
    { id: "tree4", model: "models/tree.js", position: [30, 0, 30] },
    { id: "tree5", model: "models/tree.js", position: [-40, 0, 0] },
    { id: "tree6", model: "models/tree.js", position: [40, 0, 0] },
    { id: "tree7", model: "models/tree.js", position: [0, 0, -40] },
    { id: "tree8", model: "models/tree.js", position: [0, 0, 40] },
    
    // 岩石
    { id: "rock1", model: "models/rock.js", position: [-25, 0.5, -10], scale: [1.5, 1, 1.5], collidable: true },
    { id: "rock2", model: "models/rock.js", position: [25, 0.5, 10], scale: [1.2, 0.8, 1.2], collidable: true },
    { id: "rock3", model: "models/rock.js", position: [-35, 0.5, 20], scale: [2, 1.2, 2], collidable: true },
    { id: "rock4", model: "models/rock.js", position: [35, 0.5, -20], scale: [1.8, 1, 1.8], collidable: true }
  ]
};

// ============ 游戏状态 ============
const state = {
  debug: false,
  locked: false,
  kills: 0,
  health: 100,
  maxHealth: 100,
  ammo: 30,
  maxAmmo: 30,
  ammoReserve: 90,
  wave: 1,
  enemiesKilled: 0,
  enemiesInWave: 5,
  errors: [],
  collidables: [],
  destructibles: [],
  enemies: [],
  player: {
    pos: new THREE.Vector3(0, 1.7, 40),
    vel: new THREE.Vector3(),
    onGround: false,
    height: 1.7,
    radius: 0.4,
    speed: 6,
    jumpV: 7,
  },
  yaw: 0, pitch: 0,
};

// ============ HUD ============
const $ = id => document.getElementById(id);
function pushError(msg) {
  state.errors.push(msg);
  $('errors').innerHTML = state.errors.slice(-5).map(e => '• ' + e).join('<br>');
}
function updateHUD() {
  $('debug').style.display = state.debug ? 'block' : 'none';
  $('kills').textContent = state.kills;
  $('wave').textContent = state.wave;
  $('enemies-left').textContent = state.enemiesInWave - state.enemiesKilled;
  $('health-bar-fill').style.width = (state.health / state.maxHealth * 100) + '%';
  $('health-text').textContent = state.health + ' / ' + state.maxHealth;
  $('ammo-current').textContent = state.ammo;
  $('ammo-reserve').textContent = state.ammoReserve;
}

// ============ 场景初始化 ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a9c9);
scene.fog = new THREE.Fog(0x87a9c9, 50, 150);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;   sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 150;
sun.shadow.bias = -0.0005;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x3a2a1a, 0.4);
scene.add(hemi);

// ============ 输入 ============
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Tab') {
    e.preventDefault();
    state.debug = !state.debug;
    state.player.vel.set(0,0,0);
    updateHUD();
  }
  if (e.code === 'KeyR' && state.locked) {
    reload();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

const canvas = renderer.domElement;
canvas.addEventListener('click', () => {
  if (!state.locked) canvas.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  state.locked = document.pointerLockElement === canvas;
  $('lock').classList.toggle('hidden', state.locked);
});
addEventListener('mousemove', e => {
  if (!state.locked) return;
  state.yaw   -= e.movementX * 0.0022;
  state.pitch -= e.movementY * 0.0022;
  state.pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, state.pitch));
});

addEventListener('mousedown', e => {
  if (!state.locked || e.button !== 0) return;
  shoot();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============ 武器视图 ============
const weaponHolder = new THREE.Group();
camera.add(weaponHolder);
scene.add(camera);
let weaponRecoil = 0;

// 创建武器模型
const weaponGroup = new THREE.Group();
const dark = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.7 });
const grip = new THREE.MeshStandardMaterial({ color: 0x3a2818, roughness: 0.9 });
const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.4), dark);
body.position.set(0, 0, -0.1); weaponGroup.add(body);
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3, 12), dark);
barrel.rotation.x = Math.PI / 2;
barrel.position.set(0, 0.03, -0.4); weaponGroup.add(barrel);
const handle = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.2, 0.1), grip);
handle.position.set(0, -0.12, -0.02);
handle.rotation.x = -0.2; weaponGroup.add(handle);
weaponHolder.add(weaponGroup);

// ============ 射击逻辑 ============
const raycaster = new THREE.Raycaster();
function shoot() {
  if (state.ammo <= 0) {
    reload();
    return;
  }
  state.ammo--;
  updateHUD();
  
  weaponRecoil = 0.1;
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  raycaster.set(camera.getWorldPosition(new THREE.Vector3()), dir);
  raycaster.far = 200;
  const targets = state.destructibles.map(d => d.mesh).filter(Boolean);
  const hits = raycaster.intersectObjects(targets, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj && !obj.userData.onHit) obj = obj.parent;
    if (obj && obj.userData.onHit) {
      try { obj.userData.onHit(hits[0]); } catch(e) { pushError('onHit 错误: '+e.message); }
    }
  }
}

function reload() {
  if (state.ammoReserve <= 0 || state.ammo >= state.maxAmmo) return;
  const needed = state.maxAmmo - state.ammo;
  const toLoad = Math.min(needed, state.ammoReserve);
  state.ammo += toLoad;
  state.ammoReserve -= toLoad;
  updateHUD();
}

// ============ 模型加载器 ============
const modelCache = new Map();
async function loadModel(path) {
  if (modelCache.has(path)) return modelCache.get(path);
  const fn = MODEL_REGISTRY[path];
  if (!fn) throw new Error('未知模型: ' + path);
  modelCache.set(path, fn);
  return fn;
}

function makeFallback() {
  const g = new THREE.BoxGeometry(1,1,1);
  const m = new THREE.MeshStandardMaterial({ color: 0xff0000 });
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

// ============ 加载场景 ============
async function loadScene() {
  try {
    const data = SCENE_DATA;
    if (data.player && data.player.position) {
      state.player.pos.fromArray(data.player.position);
    }
    for (const ent of (data.entities || [])) {
      try {
        const create = await loadModel(ent.model);
        const obj = create(ent.params || {});
        if (!obj || !obj.isObject3D) throw new Error('create() 未返回 Object3D');
        if (ent.position) obj.position.fromArray(ent.position);
        if (ent.rotation) obj.rotation.set(ent.rotation[0], ent.rotation[1], ent.rotation[2]);
        if (ent.scale) obj.scale.fromArray(ent.scale);
        else obj.scale.set(1,1,1);
        obj.traverse(c => {
          if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
        });
        scene.add(obj);
        if (ent.collidable) {
          const box = new THREE.Box3().setFromObject(obj);
          state.collidables.push({ mesh: obj, box });
        }
        if (obj.userData.onHit || ent.destructible) {
          state.destructibles.push({ mesh: obj, onHit: obj.userData.onHit });
        }
        if (ent.model === 'models/enemy.js') {
          state.enemies.push(obj);
        }
      } catch (err) {
        pushError('加载失败 [' + (ent.id||'?') + '] ' + ent.model + ': ' + err.message);
        const fb = makeFallback();
        if (ent.position) fb.position.fromArray(ent.position);
        if (ent.scale) fb.scale.fromArray(ent.scale);
        scene.add(fb);
        if (ent.collidable) {
          const box = new THREE.Box3().setFromObject(fb);
          state.collidables.push({ mesh: fb, box });
        }
      }
    }
  } catch (err) {
    pushError('场景加载失败: ' + err.message);
  }
}

// ============ 波次系统 ============
function spawnWave() {
  state.enemiesKilled = 0;
  state.enemiesInWave = 5 + state.wave * 2;
  
  const waveInfo = $('wave-info');
  $('wave-num').textContent = state.wave;
  waveInfo.style.display = 'block';
  setTimeout(() => { waveInfo.style.display = 'none'; }, 3000);
  
  // 在随机位置生成敌人
  for (let i = 0; i < state.enemiesInWave; i++) {
    setTimeout(() => {
      const angle = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 20;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;
      
      const types = ['normal', 'normal', 'normal', 'fast', 'heavy'];
      const type = types[Math.floor(Math.random() * types.length)];
      
      const create = MODEL_REGISTRY['models/enemy.js'];
      const enemy = create({ type });
      enemy.position.set(x, 0, z);
      enemy.traverse(c => {
        if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
      });
      scene.add(enemy);
      state.destructibles.push({ mesh: enemy, onHit: enemy.userData.onHit });
      state.enemies.push(enemy);
    }, i * 500);
  }
  
  updateHUD();
}

function checkWaveComplete() {
  if (state.enemiesKilled >= state.enemiesInWave) {
    state.wave++;
    // 补充弹药
    state.ammoReserve += 30;
    // 恢复一些生命
    state.health = Math.min(state.maxHealth, state.health + 20);
    updateHUD();
    setTimeout(spawnWave, 2000);
  }
}

// ============ 物理与移动 ============
const _forward = new THREE.Vector3();
const _right   = new THREE.Vector3();
const _moveDir = new THREE.Vector3();

function updatePlayer(dt) {
  camera.rotation.order = 'YXZ';
  camera.rotation.set(state.pitch, state.yaw, 0);
  _forward.set(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
  _right.set(Math.cos(state.yaw), 0, -Math.sin(state.yaw));
  _moveDir.set(0,0,0);
  if (keys['KeyW']) _moveDir.add(_forward);
  if (keys['KeyS']) _moveDir.sub(_forward);
  if (keys['KeyD']) _moveDir.add(_right);
  if (keys['KeyA']) _moveDir.sub(_right);
  if (_moveDir.lengthSq() > 0) _moveDir.normalize();
  const p = state.player;
  if (state.debug) {
    const speed = p.speed * 2;
    const dir = new THREE.Vector3();
    if (_moveDir.lengthSq() > 0 || keys['Space'] || keys['ShiftLeft']) {
      dir.copy(new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion));
      if (keys['Space']) dir.y += 1;
      if (keys['ShiftLeft']) dir.y -= 1;
      dir.normalize();
    }
    p.pos.addScaledVector(dir, speed * dt);
    p.vel.set(0,0,0);
  } else {
    p.vel.x = _moveDir.x * p.speed;
    p.vel.z = _moveDir.z * p.speed;
    p.vel.y -= 20 * dt;
    if (keys['Space'] && p.onGround) {
      p.vel.y = p.jumpV;
      p.onGround = false;
    }
    moveWithCollision(dt);
  }
  camera.position.copy(p.pos);
  weaponRecoil = Math.max(0, weaponRecoil - dt * 0.8);
  weaponHolder.position.set(0.25, -0.25, -0.5 + weaponRecoil);
  weaponHolder.rotation.x = -weaponRecoil * 2;
}

function moveWithCollision(dt) {
  const p = state.player;
  const newPos = p.pos.clone();
  newPos.x += p.vel.x * dt;
  if (collidesAt(newPos)) newPos.x = p.pos.x;
  newPos.z += p.vel.z * dt;
  if (collidesAt(newPos)) newPos.z = p.pos.z;
  newPos.y += p.vel.y * dt;
  if (collidesAt(newPos)) {
    if (p.vel.y < 0) p.onGround = true;
    newPos.y = p.pos.y;
    p.vel.y = 0;
  } else {
    p.onGround = false;
  }
  p.pos.copy(newPos);
  if (p.pos.y < -20) {
    p.pos.set(0, 5, 40);
    p.vel.set(0,0,0);
  }
}

function collidesAt(pos) {
  const p = state.player;
  const pMin = new THREE.Vector3(pos.x - p.radius, pos.y - p.height, pos.z - p.radius);
  const pMax = new THREE.Vector3(pos.x + p.radius, pos.y + 0.1, pos.z + p.radius);
  const pBox = new THREE.Box3(pMin, pMax);
  for (const c of state.collidables) {
    if (c.box.intersectsBox(pBox)) return true;
  }
  return false;
}

// ============ 小地图 ============
const minimapCanvas = $('minimap-canvas');
const minimapCtx = minimapCanvas.getContext('2d');
function updateMinimap() {
  minimapCtx.fillStyle = 'rgba(0,0,0,0.3)';
  minimapCtx.fillRect(0, 0, 150, 150);
  
  const scale = 1.5;
  const cx = 75, cy = 75;
  
  // 绘制碰撞体
  minimapCtx.fillStyle = '#444';
  for (const c of state.collidables) {
    const pos = c.mesh.position;
    const x = cx + pos.x * scale;
    const y = cy + pos.z * scale;
    if (x >= 0 && x <= 150 && y >= 0 && y <= 150) {
      minimapCtx.fillRect(x-2, y-2, 4, 4);
    }
  }
  
  // 绘制敌人
  minimapCtx.fillStyle = '#f00';
  for (const e of state.enemies) {
    if (!e.parent) continue;
    const x = cx + e.position.x * scale;
    const y = cy + e.position.z * scale;
    if (x >= 0 && x <= 150 && y >= 0 && y <= 150) {
      minimapCtx.beginPath();
      minimapCtx.arc(x, y, 3, 0, Math.PI*2);
      minimapCtx.fill();
    }
  }
  
  // 绘制玩家
  minimapCtx.fillStyle = '#0f0';
  const px = cx + state.player.pos.x * scale;
  const py = cy + state.player.pos.z * scale;
  minimapCtx.beginPath();
  minimapCtx.arc(px, py, 4, 0, Math.PI*2);
  minimapCtx.fill();
  
  // 绘制朝向
  minimapCtx.strokeStyle = '#0f0';
  minimapCtx.lineWidth = 2;
  minimapCtx.beginPath();
  minimapCtx.moveTo(px, py);
  minimapCtx.lineTo(px - Math.sin(state.yaw) * 10, py - Math.cos(state.yaw) * 10);
  minimapCtx.stroke();
}

// ============ 主循环 ============
let last = performance.now();
let fpsAcc = 0, fpsFrames = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state.locked) updatePlayer(dt);
  renderer.render(scene, camera);
  
  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) {
    $('fps').textContent = 'FPS: ' + Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
  }
  
  updateMinimap();
  checkWaveComplete();
}

// ============ 启动 ============
(async () => {
  updateHUD();
  await loadScene();
  spawnWave();
  requestAnimationFrame(loop);
})();
</script>
