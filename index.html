<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>绝地求生 - Web版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#000;font-family:'Microsoft YaHei',sans-serif;user-select:none;width:100%;height:100%}
canvas{display:block}
/* 主菜单 */
#main-menu{position:fixed;inset:0;background:linear-gradient(135deg,#0a0a1a,#1a2a4a,#0a1a2a);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#main-menu.hidden{display:none}
.menu-title{font-size:64px;color:#f8b500;text-shadow:0 0 30px rgba(248,181,0,.5);margin-bottom:10px;font-weight:bold;letter-spacing:8px}
.menu-sub{color:#aaa;font-size:16px;margin-bottom:50px}
.mode-select{display:flex;gap:20px;margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.mode-card{width:200px;padding:25px 20px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:12px;cursor:pointer;transition:all .3s;text-align:center}
.mode-card:hover{border-color:#f8b500;background:rgba(248,181,0,.1);transform:translateY(-5px)}
.mode-card.selected{border-color:#f8b500;background:rgba(248,181,0,.15)}
.mode-card h3{color:#fff;font-size:18px;margin-bottom:8px}
.mode-card p{color:#888;font-size:12px}
.mode-icon{font-size:36px;margin-bottom:10px}
#start-game{padding:16px 60px;font-size:20px;background:linear-gradient(135deg,#f8b500,#ff6b00);border:none;border-radius:8px;color:#fff;cursor:pointer;font-weight:bold;transition:all .2s;box-shadow:0 4px 20px rgba(248,181,0,.3)}
#start-game:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(248,181,0,.5)}
.stats-panel{position:absolute;bottom:20px;color:#666;font-size:12px;text-align:center}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#hud.active{display:block}
.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ch{position:absolute;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.8)}
.ch-t{left:50%;top:-14px;width:2px;height:10px;transform:translateX(-50%)}
.ch-b{left:50%;bottom:-14px;width:2px;height:10px;transform:translateX(-50%)}
.ch-l{left:-14px;top:50%;width:10px;height:2px;transform:translateY(-50%)}
.ch-r{right:-14px;top:50%;width:10px;height:2px;transform:translateY(-50%)}
.ch-dot{width:3px;height:3px;background:#f00;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 4px #f00}
.hitmarker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .1s}
.hitmarker.show{opacity:1}
.hitmarker div{position:absolute;width:14px;height:2px;background:#ff0}
.hm1{transform:rotate(45deg) translate(5px)}
.hm2{transform:rotate(-45deg) translate(5px)}
.hm3{transform:rotate(225deg) translate(5px)}
.hm4{transform:rotate(-225deg) translate(5px)}
/* 状态栏 */
#status-bar{position:absolute;left:20px;bottom:20px;display:flex;gap:15px;align-items:flex-end}
.bar-group{display:flex;flex-direction:column;gap:3px}
.bar-label{font-size:10px;color:#aaa;text-shadow:0 0 3px #000}
.bar-outer{width:200px;height:16px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);border-radius:3px;overflow:hidden;position:relative}
.bar-inner{height:100%;transition:width .3s}
.hp-bar{background:linear-gradient(90deg,#e74c3c,#ff6b6b)}
.armor-bar{background:linear-gradient(90deg,#3498db,#5dade2)}
.bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;text-shadow:0 0 2px #000}
/* 弹药 */
#ammo-panel{position:absolute;right:20px;bottom:20px;text-align:right}
#weapon-name{font-size:14px;color:#f8b500;margin-bottom:4px;text-shadow:0 0 5px rgba(248,181,0,.5)}
#ammo-count{font-size:32px;font-weight:bold;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.3)}
#ammo-count small{font-size:18px;color:#888}
/* 武器栏 */
#weapon-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.w-slot{width:60px;height:44px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.15);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#888;transition:all .2s}
.w-slot.active{border-color:#f8b500;background:rgba(248,181,0,.15);color:#f8b500}
.w-key{font-size:9px;color:#666;margin-bottom:2px}
/* 信息面板 */
#info-panel{position:absolute;left:20px;top:20px;font-size:12px;color:#fff;text-shadow:0 0 3px #000}
#info-panel div{margin:3px 0;background:rgba(0,0,0,.3);padding:4px 8px;border-radius:3px}
#kill-feed{position:absolute;right:20px;top:20px;font-size:12px;text-align:right;max-width:300px}
.kill-msg{color:#f8b500;text-shadow:0 0 3px #000;margin:3px 0;animation:fadeKill 4s forwards;background:rgba(0,0,0,.3);padding:3px 8px;border-radius:3px}
@keyframes fadeKill{0%{opacity:0;transform:translateX(20px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* 毒圈警告 */
#zone-warning{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:rgba(255,0,0,.8);color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;display:none;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* 小地图 */
#minimap{position:absolute;right:20px;bottom:80px;width:160px;height:160px;border:2px solid rgba(255,255,255,.3);border-radius:8px;overflow:hidden;background:rgba(0,0,0,.5)}
#minimap canvas{width:100%;height:100%}
/* 第三人称指示 */
#camera-mode{position:absolute;left:50%;top:20px;transform:translateX(-50%);color:#f8b500;font-size:14px;text-shadow:0 0 5px rgba(248,181,0,.5)}
/* 击杀统计 */
#score-panel{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);padding:15px;border-radius:8px;text-align:center;display:none}
#score-panel h3{color:#f8b500;font-size:18px;margin-bottom:10px}
#score-panel div{color:#fff;font-size:14px;margin:5px 0}
/* 特效 */
#damage-overlay{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(ellipse at center,transparent 30%,rgba(255,0,0,.4))}
#heal-overlay{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,255,0,.2))}
.scope{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle at center,transparent 25%,#000 26%)}
.scope.active{opacity:1}
.scope-line{position:absolute;background:rgba(0,0,0,.9)}
.scope-h{left:0;top:50%;width:100%;height:1px;transform:translateY(-50%)}
.scope-v{left:50%;top:0;height:100%;width:1px;transform:translateX(-50%)}
/* 暂停菜单 */
#pause-menu{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column}
#pause-menu.active{display:flex}
#pause-menu h2{color:#fff;font-size:32px;margin-bottom:30px}
#pause-menu button{display:block;width:200px;padding:12px;margin:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s}
#pause-menu button:hover{background:rgba(248,181,0,.2);border-color:#f8b500}
/* 死亡画面 */
#death-screen{position:fixed;inset:0;background:rgba(139,0,0,.85);z-index:600;display:none;align-items:center;justify-content:center;flex-direction:column}
#death-screen.active{display:flex}
#death-screen h1{color:#fff;font-size:48px;margin-bottom:20px}
#death-screen p{color:#ddd;font-size:16px;margin:5px 0}
#death-screen button{margin-top:30px;padding:14px 40px;font-size:16px;background:#f8b500;border:none;border-radius:6px;color:#fff;cursor:pointer;font-weight:bold}
</style>
</head>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ==================== 存档系统 ====================
const SaveSystem = {
  key: 'fps_game_save',
  load() {
    try { return JSON.parse(localStorage.getItem(this.key)) || this.default(); }
    catch { return this.default(); }
  },
  save(data) { localStorage.setItem(this.key, JSON.stringify(data)); },
  default() { return { totalKills: 0, gamesPlayed: 0, bestKills: 0, unlockedSkins: [] }; }
};
let saveData = SaveSystem.load();
$('total-kills').textContent = saveData.totalKills;
$('games-played').textContent = saveData.gamesPlayed;

// ==================== 音效系统 ====================
const AudioSys = {
  ctx: null,
  init() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  play(type) {
    if (!this.ctx) this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination);
    const t = this.ctx.currentTime;
    const sounds = {
      shoot: [200, 50, .1, .3], shoot_sniper: [800, 40, .25, .4],
      shoot_shotgun: [120, 30, .18, .5], shoot_smg: [300, 80, .06, .2],
      hit: [600, 200, .06, .2], kill: [500, 900, .12, .25],
      reload: [250, 400, .15, .15], pickup: [400, 800, .15, .2],
      damage: [100, 40, .2, .35], explosion: [50, 15, .4, .6],
      melee: [150, 80, .1, .3], step: [80, 60, .05, .08]
    };
    const s = sounds[type] || sounds.shoot;
    o.frequency.setValueAtTime(s[0], t);
    o.frequency.exponentialRampToValueAtTime(s[1], t + s[2]);
    g.gain.setValueAtTime(s[3], t);
    g.gain.exponentialRampToValueAtTime(.01, t + s[2]);
    o.start(t); o.stop(t + s[2] + .05);
  }
};

// ==================== 游戏配置 ====================
const MODES = {
  battle: { name: '经典大逃杀', enemies: 15, zone: true, respawn: false },
  tdm: { name: '团队竞技', enemies: 8, zone: false, respawn: true },
  zombie: { name: '丧尸模式', enemies: 0, zone: false, respawn: false, waves: true },
  training: { name: '训练场', enemies: 5, zone: false, respawn: false }
};
let currentMode = 'battle';
let gameState = 'menu'; // menu, playing, paused, dead

// ==================== 武器数据 ====================
const WEAPONS = [
  { name: 'M416', ammo: 30, max: 30, reserve: 90, dmg: 18, rate: 120, auto: true, spread: .025, recoil: .02, sound: 'shoot', range: 150 },
  { name: 'AWM', ammo: 5, max: 5, reserve: 20, dmg: 100, rate: 1500, auto: false, spread: .002, recoil: .08, sound: 'shoot_sniper', range: 300, scope: true },
  { name: 'S686', ammo: 2, max: 2, reserve: 20, dmg: 12, rate: 900, auto: false, spread: .06, recoil: .05, pellets: 9, sound: 'shoot_shotgun', range: 30 },
  { name: 'UZI', ammo: 25, max: 25, reserve: 100, dmg: 12, rate: 70, auto: true, spread: .04, recoil: .015, sound: 'shoot_smg', range: 60 },
  { name: '平底锅', ammo: Infinity, max: Infinity, reserve: 0, dmg: 50, rate: 600, auto: false, spread: 0, recoil: 0, melee: true, sound: 'melee', range: 3 }
];

// ==================== 游戏状态 ====================
const G = {
  hp: 100, maxHp: 100, armor: 0, maxArmor: 100,
  kills: 0, alive: 0, weapons: JSON.parse(JSON.stringify(WEAPONS)),
  curW: 0, lastShot: 0, reloading: false,
  yaw: 0, pitch: 0, thirdPerson: false, scoped: false,
  player: { pos: new THREE.Vector3(0, 1.7, 0), vel: new THREE.Vector3(), onGround: false, h: 1.7, r: .45, spd: 5.5, sprint: 1.7, jump: 7.5 },
  enemies: [], particles: [], pickups: [], colliders: [],
  zone: { radius: 80, targetRadius: 80, center: new THREE.Vector3(0, 0, 0), shrinkSpeed: 0, nextShrink: 30, timer: 30 },
  wave: 0, waveEnemies: 0, startTime: 0, gameDuration: 0
};

// ==================== THREE 初始化 ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 50, 200);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, .1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// 光照
const ambient = new THREE.AmbientLight(0xffffff, .5); scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff5e6, 1.5);
sun.position.set(50, 80, 30); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
sun.shadow.camera.far = 250; sun.shadow.bias = -.0008;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0x87CEEB, 0x362d1b, .4); scene.add(hemi);

// ==================== 地图生成 ====================
function makeCanvasTex(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// 地面
const grassTex = makeCanvasTex(512, 512, (ctx) => {
  ctx.fillStyle = '#3d5c3a'; ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 10000; i++) {
    const s = 50 + Math.random() * 30;
    ctx.fillStyle = `rgb(${s},${s + 20},${s - 10})`;
    ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 3);
  }
});
grassTex.repeat.set(25, 25);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200, 50, 50),
  new THREE.MeshStandardMaterial({ map: grassTex, roughness: .95 })
);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);
G.colliders.push(new THREE.Box3(new THREE.Vector3(-100, -1, -100), new THREE.Vector3(100, 0, 100)));

// 墙壁材质
const wallTex = makeCanvasTex(256, 256, (ctx) => {
  ctx.fillStyle = '#8b7355'; ctx.fillRect(0, 0, 256, 256);
  ctx.strokeStyle = '#5c4a32'; ctx.lineWidth = 2;
  for (let y = 0; y < 256; y += 32) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
    const off = (y / 32) % 2 ? 16 : 0;
    for (let x = off; x < 256; x += 64) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 32); ctx.stroke(); }
  }
});

function addBox(x, y, z, w, h, d, mat, collide = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  if (collide) G.colliders.push(new THREE.Box3().setFromObject(m));
  return m;
}

// 建筑
const buildingTex = makeCanvasTex(512, 512, (ctx) => {
  ctx.fillStyle = '#6b6b7b'; ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = '#3a4a6a';
  for (let y = 40; y < 470; y += 80) for (let x = 40; x < 470; x += 100) ctx.fillRect(x, y, 60, 60);
  ctx.fillStyle = '#1a2a3a';
  for (let y = 40; y < 470; y += 80) for (let x = 40; x < 470; x += 100) {
    if (Math.random() > .4) ctx.fillRect(x + 5, y + 5, 50, 50);
  }
});
const bldMat = new THREE.MeshStandardMaterial({ map: buildingTex, roughness: .7 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: .9 });

function makeBuilding(x, z, w, h, d, ry = 0) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bldMat);
  body.position.y = h / 2; body.castShadow = true; body.receiveShadow = true; g.add(body);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 1, .4, d + 1), roofMat);
  roof.position.y = h + .2; roof.castShadow = true; g.add(roof);
  g.position.set(x, 0, z); g.rotation.y = ry;
  scene.add(g);
  G.colliders.push(new THREE.Box3().setFromObject(body).applyMatrix4(new THREE.Matrix4().makeRotationY(ry).setPosition(x, 0, z)));
  return g;
}

// 生成地图
const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: .8 });
// 外围墙
addBox(0, 3, -70, 140, 6, 1, wallMat);
addBox(0, 3, 70, 140, 6, 1, wallMat);
addBox(-70, 3, 0, 1, 6, 140, wallMat);

  torso.position.y = 1.2 * s; torso.castShadow = true; g.add(torso);

}

// ==================== 战斗系统 ====================
function killEnemy(e) {
  if (!e.userData.alive) return;
  e.userData.alive = false;
  G.kills++; G.alive--;
  saveData.totalKills++;
  addKillMsg(`☠️ 击杀 ${e.userData.type === 'zombie' ? '丧尸' : '敌人'}`);
  AudioSys.play('kill');
  spawnParticles(e.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 0xff3333, 20, 5, 1.2);
  
  // 死亡动画
  const start = performance.now();
  const anim = () => {
    const t = (performance.now() - start) / 700;
    e.rotation.x = Math.min(t, 1) * Math.PI / 2;
    e.position.y = -Math.min(t, 1) * .6;
    if (t < 1) requestAnimationFrame(anim);
    else scene.remove(e);
  };
  anim();
  
  // 掉落
  if (Math.random() < .35) {
    const types = ['health', 'ammo', 'armor'];
    createPickup(e.position.x + (Math.random() - .5) * 2, e.position.z + (Math.random() - .5) * 2,
      types[Math.floor(Math.random() * 3)]);
  }
  
  updateHUD();
  checkGameState();
}

function shoot() {
  const w = G.weapons[G.curW];
  const now = performance.now();
  if (now - G.lastShot < w.rate || G.reloading) return;
  if (!w.melee && w.ammo <= 0) { reload(); return; }
  G.lastShot = now;
  if (!w.melee) w.ammo--;
  AudioSys.play(w.sound);
  updateHUD();
  
  // 后坐力
  weaponView.position.z += w.recoil;
  weaponView.rotation.x -= w.recoil * 1.5;
  G.pitch += w.recoil * .4;
  
  // 枪口闪光
  if (!w.melee) {
    const flash = new THREE.PointLight(0xffaa00, 4, 6);
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    flash.position.copy(camera.position).addScaledVector(fwd, 1);
    scene.add(flash);
    setTimeout(() => scene.remove(flash), 40);
  }
  
  // 射线检测
  const pellets = w.pellets || 1;
  for (let p = 0; p < pellets; p++) {
    const spread = w.spread * (G.scoped ? .15 : 1);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    dir.x += (Math.random() - .5) * spread;
    dir.y += (Math.random() - .5) * spread;
    dir.normalize();
    
    const ray = new THREE.Raycaster(camera.position.clone(), dir, 0, w.range);
    let hitSomething = false;
    
    // 检测敌人
    for (const e of G.enemies) {
      if (!e.userData.alive) continue;
      const hits = ray.intersectObject(e, true);
      if (hits.length > 0 && hits[0].distance < w.range) {
        hitSomething = true;
        e.userData.hp -= w.dmg;
        showHitmarker();
        AudioSys.play('hit');
        spawnParticles(hits[0].point, 0xff4444, 4, 3, .5, .06);
        
        // 受击反馈
        e.userData.aL.material.emissive.setHex(0xff0000);
        e.userData.aR.material.emissive.setHex(0xff0000);
        setTimeout(() => {
          if (e.userData.alive) {
            e.userData.aL.material.emissive.setHex(0);
            e.userData.aR.material.emissive.setHex(0);
          }
        }, 100);
        
        if (e.userData.hp <= 0) killEnemy(e);
        break;
      }
    }
    
    // 近战攻击
    if (w.melee && !hitSomething) {
      for (const e of G.enemies) {
        if (!e.userData.alive) continue;
        if (e.position.distanceTo(G.player.pos) < w.range) {
          e.userData.hp -= w.dmg;
          showHitmarker();
          AudioSys.play('hit');
          if (e.userData.hp <= 0) killEnemy(e);
          break;
        }
      }
    }
  }
}

function reload() {
  const w = G.weapons[G.curW];
  if (w.melee || w.ammo >= w.max || w.reserve <= 0 || G.reloading) return;
  G.reloading = true;
  AudioSys.play('reload');
  addKillMsg('🔄 换弹中...');
  setTimeout(() => {
    const need = w.max - w.ammo;
    const load = Math.min(need, w.reserve);
    w.ammo += load; w.reserve -= load;
    G.reloading = false;
    updateHUD();
  }, 1800);
}

// ==================== 敌人AI ====================
function updateEnemies(dt) {
  const pPos = G.player.pos;
  const now = performance.now();
  
  for (const e of G.enemies) {
    if (!e.userData.alive) continue;
    const d = e.userData;
    d.animT += dt * 4;
    
    // 动画
    const walkSpeed = d.state === 'chase' ? 1.5 : .8;
    d.aL.rotation.x = Math.sin(d.animT * walkSpeed) * .4;
    d.aR.rotation.x = -Math.sin(d.animT * walkSpeed) * .4;
    d.lL.rotation.x = -Math.sin(d.animT * walkSpeed) * .3;
    d.lR.rotation.x = Math.sin(d.animT * walkSpeed) * .3;
    
    const toPlayer = new THREE.Vector3().subVectors(pPos, e.position);
    toPlayer.y = 0;
    const dist = toPlayer.length();
    
    // 状态机
    if (dist < 30) d.state = 'chase';
    else if (d.state === 'chase' && dist > 40) d.state = 'patrol';
    
    if (d.state === 'chase') {
      // 追击玩家
      if (dist > 2.5) {
        toPlayer.normalize();
        e.position.addScaledVector(toPlayer, d.spd);
        e.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
      } else {
        // 攻击
        if (now - d.lastAttack > 1200) {
          d.lastAttack = now;
          takeDamage(d.dmg);
        }
      }
    } else {
      // 巡逻
      const toTarget = new THREE.Vector3().subVectors(d.patrolTarget, e.position);
      toTarget.y = 0;
      if (toTarget.length() < 2) {
        d.patrolTarget.set(
          e.position.x + (Math.random() - .5) * 40,
          0,
          e.position.z + (Math.random() - .5) * 40
        );
      } else {
        toTarget.normalize();
        e.position.addScaledVector(toTarget, d.spd * .5);
        e.rotation.y = Math.atan2(toTarget.x, toTarget.z);
      }
    }
  }
}

// ==================== 毒圈系统 ====================
function updateZone(dt) {
  if (currentMode !== 'battle') { zoneMesh.visible = false; return; }
  zoneMesh.visible = true;
  
  const z = G.zone;
  z.timer -= dt;
  
  if (z.timer <= 0) {
    z.targetRadius = Math.max(10, z.radius - 15);
    z.timer = 25;
    addKillMsg('⚠️ 毒圈即将缩小！');
  }
  
  if (z.radius > z.targetRadius) {
    z.radius = Math.max(z.targetRadius, z.radius - dt * 2);
  }
  
  zoneMesh.scale.set(z.radius, 1, z.radius);
  zoneMesh.position.x = z.center.x;
  zoneMesh.position.z = z.center.z;
  
  // 检查玩家是否在圈外
  const distToCenter = new THREE.Vector2(
    G.player.pos.x - z.center.x,
    G.player.pos.z - z.center.z
  ).length();
  
  const inZone = distToCenter <= z.radius;
  $('zone-warning').style.display = inZone ? 'none' : 'block';
  $('zone-timer').style.display = 'block';
  $('zone-time').textContent = Math.ceil(z.timer) + 's';
  
  if (!inZone) {
    takeDamage(dt * 5); // 持续掉血
  }
}

// ==================== 玩家受伤 ====================
function takeDamage(dmg) {
  if (G.armor > 0) {
    const absorbed = Math.min(G.armor, dmg * .6);
    G.armor -= absorbed;
    dmg -= absorbed;
  }
  G.hp -= dmg;
  $('damage-overlay').style.opacity = '1';
  setTimeout(() => $('damage-overlay').style.opacity = '0', 200);
  AudioSys.play('damage');
  
  if (G.hp <= 0) {
    playerDeath();
  }
  updateHUD();
}

function playerDeath() {
  gameState = 'dead';
  G.gameDuration = (Date.now() - G.startTime) / 1000;
  saveData.gamesPlayed++;
  if (G.kills > saveData.bestKills) saveData.bestKills = G.kills;
  SaveSystem.save(saveData);
  
  $('death-kills').textContent = G.kills;
  const mins = Math.floor(G.gameDuration / 60);
  const secs = Math.floor(G.gameDuration % 60);
  $('death-time').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
  $('death-rank').textContent = `#${G.alive + 1}`;
  $('death-screen').classList.add('active');
  document.exitPointerLock();
}

// ==================== 游戏状态检查 ====================
function checkGameState() {
  if (currentMode === 'battle') {
    if (G.alive <= 1 && G.kills > 0) {
      // 胜利
      addKillMsg('🏆 大吉大利，今晚吃鸡！');
      setTimeout(() => {
        gameState = 'dead';
        $('death-screen').querySelector('h1').textContent = '胜利！';
        $('death-screen').classList.add('active');
      }, 1000);
    }
  } else if (currentMode === 'zombie') {
    if (G.alive <= 0) {
      G.wave++;
      setTimeout(() => spawnWave(), 3000);
    }
  }
}

// ==================== 波次系统（丧尸模式） ====================
function spawnWave() {
  const count = 5 + G.wave * 3;
  addKillMsg(`🧟 第 ${G.wave} 波丧尸来袭！数量: ${count}`);
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 30;
      createHumanoid(
        G.player.pos.x + Math.cos(angle) * dist,
        G.player.pos.z + Math.sin(angle) * dist,
        'zombie'
      );
      updateHUD();
    }, i * 300);
  }
}

// ==================== 输入处理 ====================
const keys = {};
let mouseDown = false;

addEventListener('keydown', e => {
  keys[e.code] = true;
  
  if (e.code === 'Tab') {
    e.preventDefault();
    G.debug = !G.debug;
  }
  if (e.code === 'KeyR' && gameState === 'playing') reload();
  if (e.code === 'KeyV' && gameState === 'playing') {
    G.thirdPerson = !G.thirdPerson;
    $('camera-mode').textContent = G.thirdPerson ? '第三人称' : '第一人称';
    playerModel.visible = G.thirdPerson;
    weaponView.visible = !G.thirdPerson;
    if (G.thirdPerson) camera.fov = 85;
    else camera.fov = 75;
    camera.updateProjectionMatrix();
  }
  if (e.code === 'Escape' && gameState === 'playing') {
    gameState = 'paused';
    $('pause-menu').classList.add('active');
    document.exitPointerLock();
  }
  // 武器切换
  if (e.code >= 'Digit1' && e.code <= 'Digit5' && gameState === 'playing') {
    const idx = parseInt(e.code[5]) - 1;
    if (idx !== G.curW) {
      G.curW = idx;
      G.reloading = false;
      G.scoped = false;
      $('scope').classList.remove('active');
      buildWeaponView(idx);
      updateHUD();
      AudioSys.play('reload');
    }
  }
});
addEventListener('keyup', e => keys[e.code] = false);

addEventListener('mousedown', e => {
  if (gameState !== 'playing') return;
  if (e.button === 0) mouseDown = true;
  if (e.button === 2) {
    const w = G.weapons[G.curW];
    if (w.scope) {
      G.scoped = !G.scoped;
      $('scope').classList.toggle('active', G.scoped);
      camera.fov = G.scoped ? 20 : (G.thirdPerson ? 85 : 75);
      camera.updateProjectionMatrix();
    }
  }
});
addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });

addEventListener('mousemove', e => {
  if (gameState !== 'playing') return;
  const sens = G.scoped ? .0006 : .002;
  G.yaw -= e.movementX * sens;
  G.pitch -= e.movementY * sens;
  G.pitch = Math.max(-1.5, Math.min(1.5, G.pitch));
});
addEventListener('contextmenu', e => e.preventDefault());

// 指针锁定
renderer.domElement.addEventListener('click', () => {
  if (gameState === 'playing' && !G.locked) {
    renderer.domElement.requestPointerLock();
  }
});
document.addEventListener('pointerlockchange', () => {
  G.locked = document.pointerLockElement === renderer.domElement;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ==================== 玩家移动 ====================
function updatePlayer(dt) {
  const p = G.player;
  const spd = p.spd * (keys.ShiftLeft ? p.sprint : 1);
  
  const fwd = new THREE.Vector3(-Math.sin(G.yaw), 0, -Math.cos(G.yaw));
  const right = new THREE.Vector3(Math.cos(G.yaw), 0, -Math.sin(G.yaw));
  const move = new THREE.Vector3();
  if (keys.KeyW) move.add(fwd);
  if (keys.KeyS) move.sub(fwd);
  if (keys.KeyD) move.add(right);
  if (keys.KeyA) move.sub(right);
  if (move.lengthSq() > 0) move.normalize();
  
  if (G.debug) {
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const v = new THREE.Vector3();
    if (move.lengthSq() > 0) v.addScaledVector(move, spd * 3);
    if (keys.Space) v.y += spd * 3;
    if (keys.ControlLeft) v.y -= spd * 3;
    p.pos.addScaledVector(v, dt);
    p.vel.set(0, 0, 0);
  } else {
    p.vel.x = move.x * spd;
    p.vel.z = move.z * spd;
    p.vel.y -= 22 * dt;
    if (keys.Space && p.onGround) { p.vel.y = p.jump; p.onGround = false; }
    
    const np = p.pos.clone();
    np.x += p.vel.x * dt;
    if (!collides(np)) p.pos.x = np.x;
    np.z += p.vel.z * dt;
    if (!collides(np)) p.pos.z = np.z;
    np.y += p.vel.y * dt;
    if (collides(np)) {
      if (p.vel.y < 0) p.onGround = true;
      p.vel.y = 0;
    } else { p.pos.y = np.y; p.onGround = false; }
    
    // 边界
    p.pos.x = Math.max(-68, Math.min(68, p.pos.x));
    p.pos.z = Math.max(-68, Math.min(68, p.pos.z));
    if (p.pos.y < -10) { p.pos.set(0, 3, 0); p.vel.set(0, 0, 0); }
  }
  
  // 更新相机
  if (G.thirdPerson) {
    // 第三人称
    camera.rotation.order = 'YXZ';
    camera.rotation.set(G.pitch, G.yaw, 0);
    const offset = new THREE.Vector3(0, 2, 5).applyQuaternion(camera.quaternion);
    camera.position.copy(p.pos).add(offset);
    camera.lookAt(p.pos.x, p.pos.y + 1.5, p.pos.z);
    
    // 更新玩家模型
    playerModel.position.copy(p.pos);
    playerModel.position.y = p.pos.y - p.h;
    playerModel.rotation.y = G.yaw + Math.PI;
    
    // 动画
    const ud = playerModel.userData;
    if (move.lengthSq() > 0) {
      ud.animT += dt * 8;
      ud.aL.rotation.x = Math.sin(ud.animT) * .5;
      ud.aR.rotation.x = -Math.sin(ud.animT) * .5;
      ud.lL.rotation.x = -Math.sin(ud.animT) * .4;
      ud.lR.rotation.x = Math.sin(ud.animT) * .4;
    } else {
      ud.aL.rotation.x = ud.aR.rotation.x = ud.lL.rotation.x = ud.lR.rotation.x = 0;
    }
  } else {
    // 第一人称
    camera.rotation.order = 'YXZ';
    camera.rotation.set(G.pitch, G.yaw, 0);
    camera.position.copy(p.pos);
    
    // 武器摆动
    const bob = move.lengthSq() > 0 ? Math.sin(performance.now() * .008) * .01 : 0;
    weaponView.position.y = -.25 + bob;
    weaponView.position.z = THREE.MathUtils.lerp(weaponView.position.z, -.55, dt * 10);
    weaponView.rotation.x = THREE.MathUtils.lerp(weaponView.rotation.x, 0, dt * 10);
  }
  
  // 自动射击
  if (mouseDown && G.locked) {
    const w = G.weapons[G.curW];
    if (w.auto) shoot();
    else if (performance.now() - G.lastShot >= w.rate) shoot();
  }
  
  // 拾取
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const pk = G.pickups[i];
    if (pk.userData.alive && pk.position.distanceTo(p.pos) < 2) {
      pk.userData.alive = false;
      scene.remove(pk);
      G.pickups.splice(i, 1);
      AudioSys.play('pickup');
      if (pk.userData.type === 'health') {
        G.hp = Math.min(G.maxHp, G.hp + 35);
        $('heal-overlay').style.opacity = '1';
        setTimeout(() => $('heal-overlay').style.opacity = '0', 300);
      }
      if (pk.userData.type === 'ammo') {
        G.weapons.forEach(w => { if (!w.melee) w.reserve += w.max; });
      }
      if (pk.userData.type === 'armor') {
        G.armor = Math.min(G.maxArmor, G.armor + 40);
      }
      addKillMsg(`✨ 拾取了 ${pk.userData.type === 'health' ? '医疗包' : pk.userData.type === 'ammo' ? '弹药' : '护甲'}`);
      updateHUD();
    }
  }
}

function collides(pos) {
  const r = G.player.r;
  const box = new THREE.Box3(
    new THREE.Vector3(pos.x - r, pos.y - G.player.h, pos.z - r),
    new THREE.Vector3(pos.x + r, pos.y + .2, pos.z + r)
  );
  for (const c of G.colliders) {
    if (c.intersectsBox(box)) return true;
  }
  return false;
}

// ==================== UI更新 ====================
function updateHUD() {
  const w = G.weapons[G.curW];
  $('hp-bar').style.width = (G.hp / G.maxHp * 100) + '%';
  $('hp-text').textContent = Math.ceil(G.hp);
  $('armor-bar').style.width = (G.armor / G.maxArmor * 100) + '%';
  $('armor-text').textContent = Math.ceil(G.armor);
  $('ammo-cur').textContent = w.melee ? '∞' : w.ammo;
  $('ammo-res').textContent = w.melee ? '' : w.reserve;
  $('weapon-name').textContent = w.name;
  $('kills').textContent = G.kills;
  $('alive').textContent = G.alive;
  document.querySelectorAll('.w-slot').forEach((s, i) => {
    s.classList.toggle('active', i === G.curW);
  });
}

function showHitmarker() {
  const hm = $('hitmarker');
  hm.classList.add('show');
  setTimeout(() => hm.classList.remove('show'), 100);
}

function addKillMsg(msg) {
  const d = document.createElement('div');
  d.className = 'kill-msg';
  d.textContent = msg;
  $('kill-feed').appendChild(d);
  setTimeout(() => d.remove(), 4000);
}

// ==================== 小地图 ====================
const mmCtx = $('mm').getContext('2d');
function drawMinimap() {
  mmCtx.fillStyle = 'rgba(20, 30, 20, .8)';
  mmCtx.fillRect(0, 0, 160, 160);
  
  const s = 1.1, cx = 80, cy = 80;
  
  // 毒圈
  if (currentMode === 'battle') {
    mmCtx.strokeStyle = 'rgba(100, 100, 255, .5)';
    mmCtx.lineWidth = 2;
    mmCtx.beginPath();
    mmCtx.arc(cx + G.zone.center.x * s, cy + G.zone.center.z * s, G.zone.radius * s, 0, Math.PI * 2);
    mmCtx.stroke();
  }
  
  // 建筑（碰撞体）
  mmCtx.fillStyle = '#444';
  for (const c of G.colliders) {
    const w = (c.max.x - c.min.x) * s;
    const h = (c.max.z - c.min.z) * s;
    if (w > 2 && h > 2) {
      const x = cx + (c.min.x + c.max.x) / 2 * s;
      const y = cy + (c.min.z + c.max.z) / 2 * s;
      mmCtx.fillRect(x - w / 2, y - h / 2, w, h);
    }
  }
  
  // 敌人
  mmCtx.fillStyle = '#f44';
  for (const e of G.enemies) {
    if (!e.userData.alive) continue;
    const x = cx + e.position.x * s;
    const y = cy + e.position.z * s;
    if (x > 5 && x < 155 && y > 5 && y < 155) {
      mmCtx.beginPath();
      mmCtx.arc(x, y, 3, 0, Math.PI * 2);
      mmCtx.fill();
    }
  }
  
  // 拾取物
  mmCtx.fillStyle = '#4f4';
  for (const pk of G.pickups) {
    if (!pk.userData.alive) continue;
    const x = cx + pk.position.x * s;
    const y = cy + pk.position.z * s;
    if (x > 5 && x < 155 && y > 5 && y < 155) mmCtx.fillRect(x - 2, y - 2, 4, 4);
  }
  
  // 玩家
  mmCtx.fillStyle = '#fff';
  const px = cx + G.player.pos.x * s;
  const py = cy + G.player.pos.z * s;
  mmCtx.beginPath();
  mmCtx.arc(px, py, 4, 0, Math.PI * 2);
  mmCtx.fill();
  // 朝向
  mmCtx.strokeStyle = '#fff';
  mmCtx.lineWidth = 2;
  mmCtx.beginPath();
  mmCtx.moveTo(px, py);
  mmCtx.lineTo(px - Math.sin(G.yaw) * 12, py - Math.cos(G.yaw) * 12);
  mmCtx.stroke();
}

// ==================== 游戏初始化 ====================
function startGame(mode) {
  currentMode = mode;
  const cfg = MODES[mode];
  
  // 重置状态
  G.hp = 100; G.armor = 0; G.kills = 0; G.alive = 0;
  G.weapons = JSON.parse(JSON.stringify(WEAPONS));
  G.curW = 0; G.reloading = false; G.scoped = false;
  G.thirdPerson = false;
  G.player.pos.set(0, 1.7, 0);
  G.player.vel.set(0, 0, 0);
  G.yaw = 0; G.pitch = 0;
  G.startTime = Date.now();
  G.wave = 0;
  
  // 清理旧敌人和拾取物
  G.enemies.forEach(e => scene.remove(e));
  G.enemies = [];
  G.pickups.forEach(p => scene.remove(p));
  G.pickups = [];
  G.particles.forEach(p => scene.remove(p.mesh));
  G.particles = [];
  
  // 生成敌人
  if (mode === 'zombie') {
    G.wave = 1;
    spawnWave();
  } else {
    const count = cfg.enemies;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 40;
      let type = 'normal';
      if (Math.random() < .2) type = 'fast';
      if (Math.random() < .1) type = 'heavy';
      if (mode === 'battle' && i === count - 1) type = 'boss';
      createHumanoid(Math.cos(angle) * dist, Math.sin(angle) * dist, type);
    }
  }
  
  // 生成拾取物
  for (let i = 0; i < 12; i++) {
    const types = ['health', 'ammo', 'armor'];
    createPickup(
      (Math.random() - .5) * 100,
      (Math.random() - .5) * 100,
      types[Math.floor(Math.random() * 3)]
    );
  }
  
  // 重置毒圈
  G.zone = { radius: 80, targetRadius: 80, center: new THREE.Vector3(0, 0, 0), timer: 30 };
  
  // UI
  $('mode-display').textContent = cfg.name;
  $('alive-count').style.display = mode === 'training' ? 'none' : 'block';
  $('zone-timer').style.display = mode === 'battle' ? 'block' : 'none';
  $('camera-mode').textContent = '第一人称';
  playerModel.visible = false;
  weaponView.visible = true;
  camera.fov = 75;
  camera.updateProjectionMatrix();
  
  buildWeaponView(0);
  updateHUD();
  
  gameState = 'playing';
  $('main-menu').classList.add('hidden');
  $('hud').classList.add('active');
  
  renderer.domElement.requestPointerLock();
}

// ==================== 主循环 ====================
let last = performance.now(), fpsA = 0, fpsF = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  
  if (gameState === 'playing' && G.locked) {
    updatePlayer(dt);
    updateEnemies(dt);
    updateZone(dt);
    
    // 拾取物浮动动画
    for (const pk of G.pickups) {
      if (!pk.userData.alive) continue;
      pk.userData.t += dt * 3;
      pk.children[0].position.y = pk.userData.baseY + Math.sin(pk.userData.t) * .1;
      pk.children[0].rotation.y += dt * 2;
    }
  }
  
  // 粒子更新
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt;
    p.vel.y -= 12 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      G.particles.splice(i, 1);
    }
  }
  
  renderer.render(scene, camera);
  
  if (gameState === 'playing') {
    drawMinimap();
  }
  
  fpsA += dt; fpsF++;
  if (fpsA >= .5) {
    $('fps-display').textContent = Math.round(fpsF / fpsA) + ' FPS';
    fpsA = 0; fpsF = 0;
  }
}

// ==================== 菜单事件 ====================
document.querySelectorAll('.mode-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    currentMode = card.dataset.mode;
  });
});

$('start-game').addEventListener('click', () => {
  AudioSys.init();
  startGame(currentMode);
});

$('resume-btn').addEventListener('click', () => {
  gameState = 'playing';
  $('pause-menu').classList.remove('active');
  renderer.domElement.requestPointerLock();
});

$('restart-btn').addEventListener('click', () => {
  $('pause-menu').classList.remove('active');
  startGame(currentMode);
});

$('quit-btn').addEventListener('click', () => {
  gameState = 'menu';
  $('pause-menu').classList.remove('active');
  $('hud').classList.remove('active');
  $('main-menu').classList.remove('hidden');
  $('total-kills').textContent = saveData.totalKills;
  $('games-played').textContent = saveData.gamesPlayed;
});

$('respawn-btn').addEventListener('click', () => {
  $('death-screen').classList.remove('active');
  $('death-screen').querySelector('h1').textContent = '你被击杀了';
  startGame(currentMode);
});

// ==================== 启动 ====================
requestAnimationFrame(loop);
</script>
