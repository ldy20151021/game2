<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>绝地求生 - 战术行动</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Microsoft YaHei',sans-serif;color:#e0e0e0;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;position:absolute;top:0;left:0;z-index:1}
.hidden{display:none!important}
#main-menu{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0a0f14,#1a2530,#0d151c);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto}
#main-menu.hidden{display:none}
.menu-container{position:relative;z-index:2;text-align:center;width:95%;max-width:900px;padding:20px 0}
.game-logo{font-size:min(10vw,60px);font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,#fff,#f8b500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
.game-subtitle{color:#8899aa;font-size:14px;letter-spacing:3px;margin-bottom:30px}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:25px}
.mode-card{padding:18px 10px;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08);border-radius:10px;cursor:pointer;transition:all .2s;text-align:center}
.mode-card:hover{border-color:#f8b500;transform:translateY(-3px)}
.mode-card.selected{border-color:#f8b500;background:rgba(248,181,0,.1);box-shadow:0 0 20px rgba(248,181,0,.2)}
.mode-icon{font-size:30px;margin-bottom:8px;display:block}
.mode-card h3{font-size:14px;margin-bottom:4px;color:#fff}
.mode-card p{font-size:11px;color:#8899aa;line-height:1.4}
.btn-primary{padding:15px 60px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#f8b500,#ff8c00);border:none;border-radius:8px;color:#000;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(248,181,0,.3)}
.btn-primary:hover{transform:scale(1.05)}
.btn-primary:active{transform:scale(.95)}
.settings-panel{text-align:left;max-width:500px;margin:0 auto}
.setting-group{margin-bottom:15px;background:rgba(255,255,255,.03);padding:15px;border-radius:8px;border:1px solid rgba(255,255,255,.06)}
.setting-group h4{color:#f8b500;margin-bottom:10px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:6px}
.setting-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}
.setting-row input[type="range"]{width:140px;accent-color:#f8b500}
.setting-row select{padding:4px 10px;background:#1a2530;border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:4px}
.setting-val{color:#f8b500;font-weight:bold;min-width:30px;text-align:right}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:600px;margin:0 auto 20px}
.stat-card{background:rgba(255,255,255,.03);padding:15px;border-radius:8px;border:1px solid rgba(255,255,255,.06);text-align:center}
.stat-val{font-size:24px;font-weight:bold;color:#f8b500}
.stat-label{font-size:11px;color:#8899aa;margin-top:4px}
.menu-tabs{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.menu-tab{padding:8px 20px;background:transparent;border:1px solid rgba(255,255,255,.1);color:#8899aa;font-size:13px;cursor:pointer;border-radius:4px;transition:all .2s}
.menu-tab.active{background:#f8b500;color:#000;border-color:#f8b500;font-weight:bold}
.menu-content{display:none}.menu-content.active{display:block}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#hud.active{display:block}
.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ch-line{position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 2px rgba(0,0,0,.8)}
.ch-t{left:50%;top:-12px;width:2px;height:8px;transform:translateX(-50%)}
.ch-b{left:50%;bottom:-12px;width:2px;height:8px;transform:translateX(-50%)}
.ch-l{left:-12px;top:50%;width:8px;height:2px;transform:translateY(-50%)}
.ch-r{right:-12px;top:50%;width:8px;height:2px;transform:translateY(-50%)}
.ch-dot{position:absolute;left:50%;top:50%;width:2px;height:2px;background:#f44;border-radius:50%;transform:translate(-50%,-50%)}
.hitmarker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0}
.hitmarker.show{opacity:1}
.hm-line{position:absolute;width:12px;height:2px;background:#fff}
.hm-1{transform:rotate(45deg) translate(6px,6px)}
.hm-2{transform:rotate(-45deg) translate(-6px,6px)}
.hm-3{transform:rotate(225deg) translate(6px,6px)}
.hm-4{transform:rotate(-225deg) translate(-6px,6px)}
.hitmarker.headshot .hm-line{background:#f44}
#top-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:15px;background:rgba(0,0,0,.5);padding:6px 15px;border-radius:15px;border:1px solid rgba(255,255,255,.1)}
#top-info .info-item{text-align:center}
#top-info .info-val{font-size:16px;font-weight:bold;color:#fff}
#top-info .info-label{font-size:9px;color:#8899aa}
#kill-feed{position:absolute;top:50px;right:10px;width:250px;pointer-events:none}
.kill-msg{background:rgba(0,0,0,.6);padding:4px 10px;margin-bottom:3px;border-radius:3px;font-size:11px;color:#fff;animation:slideIn .3s ease,fadeOut 4s 2s forwards;border-left:3px solid #f8b500}
.kill-msg .killer{color:#f8b500;font-weight:bold}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOut{to{opacity:0}}
#status-bars{position:absolute;bottom:15px;left:15px;width:200px}
.status-bar{margin-bottom:6px}
.status-bar-bg{width:100%;height:14px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.1);border-radius:3px;overflow:hidden;position:relative}
.status-bar-fill{height:100%;transition:width .3s}
.hp-fill{background:linear-gradient(90deg,#c62828,#e53935)}
.hp-fill.low{animation:pulseLow 1s infinite}
@keyframes pulseLow{0%,100%{opacity:1}50%{opacity:.5}}
.armor-fill{background:linear-gradient(90deg,#1565c0,#1e88e5)}
.status-bar-text{position:absolute;inset:0;display:flex;align-items:center;padding:0 6px;font-size:9px;font-weight:bold;color:#fff}
#weapon-panel{position:absolute;bottom:15px;right:15px;text-align:right}
#weapon-name-display{font-size:12px;color:#f8b500;margin-bottom:2px}
#ammo-display{font-size:32px;font-weight:bold;color:#fff}
#ammo-display .reserve{font-size:16px;color:#8899aa}
#fire-mode{font-size:10px;color:#8899aa;margin-top:2px}
#minimap-container{position:absolute;top:10px;left:10px;width:120px;height:120px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
#minimap-canvas{width:100%;height:100%}
#zone-warning{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(200,0,0,.8);color:#fff;padding:6px 16px;border-radius:4px;font-size:13px;display:none;animation:pulseWarn 1s infinite}
@keyframes pulseWarn{0%,100%{opacity:1}50%{opacity:.5}}
#interact-prompt{position:absolute;left:50%;top:65%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 16px;border-radius:4px;font-size:13px;color:#fff;display:none;border:1px solid #f8b500}
#interact-prompt .key{color:#f8b500;font-weight:bold;margin-right:6px}
.overlay{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;z-index:15}
#dmg-overlay{background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.4))}
#heal-overlay{background:radial-gradient(ellipse at center,transparent 40%,rgba(0,255,100,.2))}
#scope-overlay{background:radial-gradient(circle at center,transparent 25%,#000 26%)}
#scope-overlay.active{opacity:1}
.sc-l{position:absolute;background:rgba(0,0,0,.85)}
.sc-h{left:0;top:50%;width:100%;height:1px;transform:translateY(-50%)}
.sc-v{left:50%;top:0;height:100%;width:1px;transform:translateX(-50%)}
#drop-screen{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#drop-screen.active{display:flex}
#drop-altitude{font-size:min(15vw,60px);font-weight:900;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5)}
#drop-speed{font-size:20px;color:#f8b500;margin-top:8px}
#drop-prompt{font-size:16px;color:#fff;margin-top:30px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#pause-menu{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column}
#pause-menu.active{display:flex}
#pause-menu h2{font-size:32px;color:#fff;margin-bottom:30px}
.pause-btn{display:block;width:220px;padding:13px;margin:6px 0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;cursor:pointer;border-radius:6px;transition:all .2s;text-align:center}
.pause-btn:hover{background:#f8b500;color:#000}
#death-screen{position:fixed;inset:0;z-index:300;background:rgba(20,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column}
#death-screen.active{display:flex}
#death-screen h1{font-size:min(10vw,48px);color:#e53935;margin-bottom:15px}
#death-screen.victory h1{color:#f8b500}
.death-stats{display:flex;gap:25px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
.death-stat{text-align:center}
.death-stat .val{font-size:28px;font-weight:bold;color:#fff}
.death-stat .label{font-size:11px;color:#8899aa;margin-top:3px}
/* 移动端控制 */
#mobile-controls{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#mobile-controls.active{display:block}
.joystick-zone{position:absolute;bottom:60px;left:20px;width:120px;height:120px;pointer-events:auto}
.joystick-base{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);position:relative}
.joystick-thumb{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.4);position:absolute;left:30px;top:30px;transition:none}
.look-zone{position:absolute;top:0;right:0;width:50%;height:100%;pointer-events:auto}
.mobile-btn{position:absolute;pointer-events:auto;width:55px;height:55px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:bold;cursor:pointer}
.mobile-btn:active{background:rgba(248,181,0,.3);border-color:#f8b500}
#btn-fire{bottom:80px;right:25px;width:70px;height:70px;font-size:14px;background:rgba(255,50,50,.2);border-color:rgba(255,50,50,.4)}
#btn-fire:active{background:rgba(255,50,50,.5)}
#btn-jump{bottom:160px;right:90px}
#btn-reload{bottom:160px;right:25px}
#btn-crouch{bottom:80px;right:110px}
#btn-ads{bottom:240px;right:25px}
#btn-weapon-next{top:140px;right:10px;width:45px;height:45px}
#btn-interact{bottom:240px;right:90px;display:none}
.dmg-number{position:fixed;pointer-events:none;font-weight:bold;font-size:16px;color:#fff;text-shadow:0 1px 3px #000;z-index:20;animation:floatUp 1s ease-out forwards}
.dmg-number.headshot{color:#f44;font-size:20px}
.dmg-number.heal{color:#43a047}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
</style>
</head>
<body>

<div id="main-menu">
  <div class="menu-container">
    <div class="game-logo">绝地求生</div>
    <div class="game-subtitle">战 术 行 动</div>
    <div class="menu-tabs">
      <button class="menu-tab active" data-tab="play">开始游戏</button>

        <div class="mode-card" data-mode="tdm"><span class="mode-icon">⚔️</span><h3>团队竞技</h3><p>快节奏对战击杀</p></div>
        <div class="mode-card" data-mode="zombie"><span class="mode-icon">🧟</span><h3>丧尸围城</h3><p>抵御丧尸进攻</p></div>

        </div>
      </div>
    </div>
  </div>
</div>

<div id="hud">
  <div class="crosshair"><div class="ch-line ch-t"></div><div class="ch-line ch-b"></div><div class="ch-line ch-l"></div><div class="ch-line ch-r"></div><div class="ch-dot"></div></div>
  <div class="hitmarker" id="hitmarker"><div class="hm-line hm-1"></div><div class="hm-line hm-2"></div><div class="hm-line hm-3"></div><div class="hm-line hm-4"></div></div>

<script type="module">
import * as THREE from 'three';

// ===== 配置 =====
const CONFIG={MAP_SIZE:200,GRAVITY:25,JUMP_FORCE:8,PLAYER_HEIGHT:1.7,PLAYER_RADIUS:0.4,CROUCH_HEIGHT:1.0,DROP_ALTITUDE:1000,ZONE_INITIAL_RADIUS:90,ZONE_SHRINK_INTERVAL:45,ZONE_DAMAGE_BASE:2};

// ===== 检测是否移动端 =====
const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry/i.test(navigator.userAgent) || ('ontouchstart' in window);

// ===== 存档 =====
const SAVE_KEY='pubg_mobile_save';
let save=JSON.parse(localStorage.getItem(SAVE_KEY)||'{"kills":0,"wins":0,"games":0,"headshots":0,"shots":0,"time":0,"dist":0}');
$('stat-kills').textContent=save.kills;$('stat-wins').textContent=save.wins;$('stat-games').textContent=save.games;

// ===== 音频 =====
let audioCtx=null;
function sfx(type,vol=1){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  const t=audioCtx.currentTime;
  const S={shoot:[180,40,.08,.25],hit:[600,200,.05,.2],kill:[500,900,.12,.2],pickup:[400,800,.1,.15],damage:[90,35,.15,.3],explosion:[45,12,.4,.5],melee:[130,70,.08,.2],reload:[300,500,.15,.1],enemy_shoot:[200,60,.07,.15]};
  const s=S[type]||S.shoot;
  o.frequency.setValueAtTime(s[0],t);o.frequency.exponentialRampToValueAtTime(s[1],t+s[2]);
  g.gain.setValueAtTime(s[3]*vol,t);g.gain.exponentialRampToValueAtTime(.01,t+s[2]);
  o.start(t);o.stop(t+s[2]+.02);
}

// ===== 场景 =====
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.FogExp2(0x87CEEB,0.004);
const camera=new THREE.PerspectiveCamera(85,innerWidth/innerHeight,0.1,500);
const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setSize(innerWidth,innerHeight);
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.5));
const sun=new THREE.DirectionalLight(0xfff5e6,1.6);
sun.position.set(60,100,40);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);

class Enemy{
  constructor(x,z,type='normal'){
    this.type=type;this.alive=true;
    this.group=new THREE.Group();
    this.group.userData.isEnemy=true;
    const cfg={normal:{hp:50,spd:4,dmg:8,color:0x4a6b4a,fireRate:500},fast:{hp:30,spd:7,dmg:5,color:0x6b4a6b,fireRate:300},heavy:{hp:120,spd:2.5,dmg:15,color:0x3a3a6b,fireRate:700},zombie:{hp:60,spd:3.5,dmg:12,color:0x3a6b3a,fireRate:1000,melee:true}};
    this.cfg=cfg[type]||cfg.normal;
    this.hp=this.cfg.hp;this.maxHp=this.cfg.hp;
    this.lastShot=0;this.strafeDir=Math.random()>.5?1:-1;this.strafeTimer=0;
    this.buildModel();
    this.group.position.set(x,0,z);
    scene.add(this.group);
  }
  buildModel(){
    const c=this.cfg,isZ=this.type==='zombie';
    const cloth=new THREE.MeshStandardMaterial({color:c.color,roughness:.75});
    const skin=new THREE.MeshStandardMaterial({color:isZ?0x6b9b6b:0xd4a574});
    const dark=new THREE.MeshStandardMaterial({color:0x1a1a1a});
    this.torso=new THREE.Mesh(new THREE.BoxGeometry(.5,.7,.3),cloth);
    this.torso.position.y=1.15;this.torso.castShadow=true;this.group.add(this.torso);
    this.head=new THREE.Mesh(new THREE.BoxGeometry(.28,.28,.28),skin);
    this.head.position.y=1.7;this.head.castShadow=true;this.group.add(this.head);
    const eyeMat=new THREE.MeshStandardMaterial({color:isZ?0x00ff00:0x111111,emissive:isZ?0x00ff00:0,emissiveIntensity:isZ?2:0});
    const eL=new THREE.Mesh(new THREE.BoxGeometry(.05,.04,.02),eyeMat);eL.position.set(-.07,1.72,.15);this.group.add(eL);
    const eR=eL.clone();eR.position.x=.07;this.group.add(eR);
    const armG=new THREE.BoxGeometry(.12,.55,.12);
    this.aL=new THREE.Mesh(armG,cloth);this.aL.position.set(-.34,1.1,0);this.group.add(this.aL);
    this.aR=new THREE.Mesh(armG,cloth);this.aR.position.set(.34,1.1,0);this.group.add(this.aR);
    const legG=new THREE.BoxGeometry(.15,.65,.15);
    this.lL=new THREE.Mesh(legG,dark);this.lL.position.set(-.12,.33,0);this.group.add(this.lL);
    this.lR=new THREE.Mesh(legG,dark);this.lR.position.set(.12,.33,0);this.group.add(this.lR);
    if(!isZ){
      const gun=new THREE.Mesh(new THREE.BoxGeometry(.04,.05,.4),new THREE.MeshStandardMaterial({color:0x333333,metalness:.7}));
      gun.position.set(.3,1.15,-.2);this.group.add(gun);
    }
  }
  update(dt){
    if(!this.alive)return;
    const toP=new THREE.Vector3().subVectors(G.player.pos,this.group.position);
    toP.y=0;const dist=toP.length();
    const dir=toP.clone().normalize();
    const t=performance.now()*.001*4;
    this.aL.rotation.x=Math.sin(t)*.4;this.aR.rotation.x=-Math.sin(t)*.4;
    this.lL.rotation.x=-Math.sin(t)*.3;this.lR.rotation.x=Math.sin(t)*.3;
    if(dist>2.5){
      this.strafeTimer-=dt;
      if(this.strafeTimer<=0){this.strafeDir*=-1;this.strafeTimer=1+Math.random()*2;}
      const strafe=new THREE.Vector3(-dir.z,0,dir.x).multiplyScalar(this.strafeDir);
      let moveDir;
      if(dist>15)moveDir=dir.clone().add(strafe.multiplyScalar(.3)).normalize();
      else if(dist<5&&!this.cfg.melee)moveDir=dir.clone().multiplyScalar(-1);
      else moveDir=strafe.normalize();
      this.group.position.addScaledVector(moveDir,this.cfg.spd*dt);
      this.group.rotation.y=Math.atan2(dir.x,dir.z);
    }else{
      this.group.rotation.y=Math.atan2(dir.x,dir.z);
      const now=performance.now();
      if(now-this.lastShot>this.cfg.fireRate){
        this.lastShot=now;
        Player.takeDamage(this.cfg.dmg,this.group.position);
      }
    }
    if(!this.cfg.melee&&dist<50){
      const now=performance.now();
      if(now-this.lastShot>this.cfg.fireRate){
        this.lastShot=now;
        if(Math.random()<.35*(1-dist/60)){
          Player.takeDamage(this.cfg.dmg,this.group.position);
        }
        sfx('enemy_shoot',.3);
      }
    }
    const half=CONFIG.MAP_SIZE/2-5;
    this.group.position.x=Math.max(-half,Math.min(half,this.group.position.x));
    this.group.position.z=Math.max(-half,Math.min(half,this.group.position.z));
  }
  takeDamage(amount,isHead,attacker){
    if(!this.alive)return;
    this.hp-=amount;
    this.torso.material.emissive.setHex(0xff0000);
    setTimeout(()=>{if(this.alive)this.torso.material.emissive.setHex(0);},80);
    if(this.hp<=0)this.die(attacker);
  }
  die(killer){
    this.alive=false;
    if(killer==='player'){G.kills++;UIManager.addKillFeed('你',this.type==='zombie'?'丧尸':'敌兵',G.weapons[G.curW]?.name||'未知');}
    sfx('kill');
    spawnParticles(this.group.position.clone().add(new THREE.Vector3(0,1.2,0)),0xcc0000,15,5,1);
    const st=performance.now();
    const anim=()=>{
      const t=(performance.now()-st)/700;
      if(t>=1){scene.remove(this.group);return;}
      this.group.rotation.x=t*Math.PI/2*.9;
      this.group.position.y=-t*.5;
      requestAnimationFrame(anim);
    };anim();
    checkWin();
  }
}

function spawnParticles(pos,color,n,spd=5,life=1){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.06,.06,.06),new THREE.MeshBasicMaterial({color,transparent:true}));
    m.position.copy(pos);scene.add(m);
    const v=new THREE.Vector3((Math.random()-.5)*spd,Math.random()*spd*.7,(Math.random()-.5)*spd);
    G.particles.push({mesh:m,vel:v,life,maxLife:life});
  }
}

// ===== 玩家 =====
const Player={
  takeDamage(amount,fromPos){
    if(G.state!=='playing')return;
    if(G.armor>0){const ab=Math.min(G.armor,amount*.6);G.armor-=ab;amount-=ab;}
    G.hp-=amount;
    $('dmg-overlay').style.opacity='1';setTimeout(()=>$('dmg-overlay').style.opacity='0',200);
    sfx('damage',.5);
    UIManager.updateHUD();
    if(G.hp<=0)Game.endMatch(false);
  },
  heal(amount){
    G.hp=Math.min(G.maxHp,G.hp+amount);
    $('heal-overlay').style.opacity='1';setTimeout(()=>$('heal-overlay').style.opacity='0',300);
    UIManager.updateHUD();
  },
  shoot(){
    const wep=G.weapons[G.curW];if(!wep)return;
    const now=performance.now();
    if(now-G.lastShot<wep.rate)return;
    if(G.reloading)return;
    if(!wep.melee&&wep.ammo<=0){Player.reload();return;}
    G.lastShot=now;
    if(!wep.melee){wep.ammo--;G.shotsFired++;}
    sfx(wep.melee?'melee':'shoot');
    G.recoilY+=wep.recoil;
    const pellets=wep.pellets||1;
    for(let p=0;p<pellets;p++){
      const spread=wep.spread*(G.isADS?.3:1)*(G.crouching?.7:1);
      const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
      dir.x+=(Math.random()-.5)*spread;dir.y+=(Math.random()-.5)*spread;dir.normalize();
      const ray=new THREE.Raycaster(camera.position.clone(),dir,0,wep.range);
      const enemyMeshes=G.enemies.map(e=>e.group).filter(g=>g.parent);
      const hits=ray.intersectObjects(enemyMeshes,true);
      if(hits.length>0){
        const hit=hits[0];
        let eg=hit.object;while(eg&&!eg.userData.isEnemy)eg=eg.parent;
        if(eg){
          const enemy=G.enemies.find(e=>e.group===eg);
          if(enemy&&enemy.alive){
            const localY=hit.point.y-eg.position.y;
            const isHead=localY>1.5;
            let dmg=wep.dmg*(isHead?2.5:(localY<.8?.6:1));
            enemy.takeDamage(dmg,isHead,'player');
            if(isHead)G.headshots++;
            G.damageDealt+=dmg;
            UIManager.showHitmarker(isHead);
            sfx('hit',.5);
            spawnParticles(hit.point,0xff4444,4,3,.5);
          }
        }
      }
    }
    if(wep.melee){
      for(const e of G.enemies){
        if(!e.alive)continue;
        if(e.group.position.distanceTo(G.player.pos)<wep.range){
          e.takeDamage(wep.dmg,false,'player');break;
        }
      }
    }
    UIManager.updateHUD();
  },
  reload(){
    const wep=G.weapons[G.curW];
    if(!wep||wep.melee||G.reloading)return;
    if(wep.ammo>=wep.max)return;
    if(wep.res<=0)return;
    G.reloading=true;sfx('reload');
    setTimeout(()=>{
      const need=wep.max-wep.ammo;
      const take=Math.min(need,wep.res);
      wep.ammo+=take;wep.res-=take;
      G.reloading=false;UIManager.updateHUD();
    },1800);
  },
  switchWeapon(){
    const next=(G.curW+1)%2;
    if(G.weapons[next]){G.curW=next;buildWeaponView();UIManager.updateHUD();}
  }
};

const UIManager={
  updateHUD(){
    const wep=G.weapons[G.curW];
    $('hp-fill').style.width=Math.max(0,G.hp/G.maxHp*100)+'%';
    $('hp-fill').classList.toggle('low',G.hp<30);
    $('hp-text').textContent=Math.ceil(G.hp);
    $('armor-fill').style.width=(G.armor/G.maxArmor*100)+'%';
    $('armor-text').textContent=Math.ceil(G.armor);
    if(wep){
      $('weapon-name-display').textContent=wep.name;
      $('ammo-cur').textContent=wep.melee?'∞':wep.ammo;
      $('ammo-res').textContent=wep.melee?'':wep.res;
      $('fire-mode').textContent=wep.melee?'近战':(wep.auto?'全自动':'单发');
    }
    $('hud-alive').textContent=G.enemies.filter(e=>e.alive).length+1;
    $('hud-kills').textContent=G.kills;
  },
  showHitmarker(hs){
    const hm=$('hitmarker');
    hm.classList.toggle('headshot',hs);
    hm.classList.add('show');setTimeout(()=>hm.classList.remove('show'),100);
  },
  addKillFeed(killer,victim,weapon){
    const feed=$('kill-feed');
    const msg=document.createElement('div');msg.className='kill-msg';
    msg.innerHTML=`<span class="killer">${killer}</span> [${weapon}] ${victim}`;
    feed.appendChild(msg);setTimeout(()=>msg.remove(),4000);
    while(feed.children.length>5)feed.removeChild(feed.firstChild);
  },
  updateMinimap(){
    const c=$('minimap-canvas').getContext('2d');
    const w=120;
    c.fillStyle='rgba(20,30,20,.9)';c.fillRect(0,0,w,w);
    const s=w/CONFIG.MAP_SIZE,cx=w/2,cy=w/2;
    if(G.mode==='battle'){
      c.strokeStyle='rgba(80,80,255,.5)';c.lineWidth=2;
      c.beginPath();c.arc(cx+G.zone.cx*s,cy+G.zone.cz*s,G.zone.r*s,0,Math.PI*2);c.stroke();
    }
    c.fillStyle='#444';
    for(const col of colliders){
      const cw=(col.max.x-col.min.x)*s,ch=(col.max.z-col.min.z)*s;
      if(cw>2&&ch>2&&cw<40){
        c.fillRect(cx+(col.min.x+col.max.x)/2*s-cw/2,cy+(col.min.z+col.max.z)/2*s-ch/2,cw,ch);
      }
    }
    c.fillStyle='#f44';
    for(const e of G.enemies){
      if(!e.alive)continue;
      const x=cx+e.group.position.x*s,y=cy+e.group.position.z*s;
      if(x>0&&x<w&&y>0&&y<w){c.beginPath();c.arc(x,y,3,0,Math.PI*2);c.fill();}
    }
    c.fillStyle='#fff';
    const px=cx+G.player.pos.x*s,py=cy+G.player.pos.z*s;
    c.beginPath();c.arc(px,py,4,0,Math.PI*2);c.fill();
    c.strokeStyle='#fff';c.lineWidth=2;
    c.beginPath();c.moveTo(px,py);
    c.lineTo(px-Math.sin(G.yaw)*10,py-Math.cos(G.yaw)*10);c.stroke();
  }
};

// ===== 移动端触控 =====
if(isMobile){
  $('mobile-controls').classList.add('active');
  
  // 虚拟摇杆
  const joyZone=$('joystick-zone'),joyThumb=$('joystick-thumb');
  let joyActive=false,joyStartX=0,joyStartY=0;
  joyZone.addEventListener('touchstart',e=>{
    e.preventDefault();joyActive=true;
    joyStartX=e.touches[0].clientX;joyStartY=e.touches[0].clientY;
  });
  joyZone.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(!joyActive)return;
    const dx=e.touches[0].clientX-joyStartX;
    const dy=e.touches[0].clientY-joyStartY;
    const maxDist=40;
    const dist=Math.min(Math.sqrt(dx*dx+dy*dy),maxDist);
    const angle=Math.atan2(dy,dx);
    Input.joyX=Math.cos(angle)*dist/maxDist;
    Input.joyY=Math.sin(angle)*dist/maxDist;
    joyThumb.style.left=(30+Math.cos(angle)*dist)+'px';
    joyThumb.style.top=(30+Math.sin(angle)*dist)+'px';
  });
  joyZone.addEventListener('touchend',e=>{
    e.preventDefault();joyActive=false;Input.joyX=0;Input.joyY=0;
    joyThumb.style.left='30px';joyThumb.style.top='30px';
  });
  
  // 视角控制（右半屏）
  const lookZone=$('look-zone');
  lookZone.addEventListener('touchstart',e=>{
    e.preventDefault();
    Input.touchLookId=e.changedTouches[0].identifier;
    Input.lastTouchX=e.changedTouches[0].clientX;
    Input.lastTouchY=e.changedTouches[0].clientY;
  });
  lookZone.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(let i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===Input.touchLookId){
        const dx=e.changedTouches[i].clientX-Input.lastTouchX;
        const dy=e.changedTouches[i].clientY-Input.lastTouchY;
        Input.mouseDX+=dx*2;Input.mouseDY+=dy*2;
        Input.lastTouchX=e.changedTouches[i].clientX;
        Input.lastTouchY=e.changedTouches[i].clientY;
      }
    }
  });
  lookZone.addEventListener('touchend',e=>{Input.touchLookId=null;});
  
  // 按钮
  $('btn-fire').addEventListener('touchstart',e=>{e.preventDefault();Input.mouseDown=true;});
  $('btn-fire').addEventListener('touchend',e=>{e.preventDefault();Input.mouseDown=false;});
  $('btn-jump').addEventListener('touchstart',e=>{e.preventDefault();Input.keys['Space']=true;});
  $('btn-jump').addEventListener('touchend',e=>{Input.keys['Space']=false;});
  $('btn-reload').addEventListener('touchstart',e=>{e.preventDefault();Player.reload();});
  $('btn-crouch').addEventListener('touchstart',e=>{e.preventDefault();G.crouching=!G.crouching;});
  $('btn-ads').addEventListener('touchstart',e=>{e.preventDefault();G.isADS=!G.isADS;$('scope-overlay').classList.toggle('active',G.isADS);});
  $('btn-weapon-next').addEventListener('touchstart',e=>{e.preventDefault();Player.switchWeapon();});
  $('btn-interact').addEventListener('touchstart',e=>{e.preventDefault();Input.keys['KeyF']=true;setTimeout(()=>Input.keys['KeyF']=false,100);});
}

// 跳伞点击
$('drop-screen').addEventListener('touchstart',e=>{
  if(!G.parachute&&G.player.pos.y<CONFIG.DROP_ALTITUDE-50){G.parachute=true;$('drop-prompt').textContent='滑动屏幕控制方向';}
});
$('drop-screen').addEventListener('click',()=>{
  if(!G.parachute&&G.player.pos.y<CONFIG.DROP_ALTITUDE-50){G.parachute=true;$('drop-prompt').textContent='滑动屏幕控制方向';}
});

// ===== 毒圈 =====
function updateZone(dt){
  if(G.mode!=='battle'){zoneMesh.visible=false;return;}
  zoneMesh.visible=true;
  G.zone.timer-=dt;
  if(G.zone.timer<=0){
    G.zone.target=Math.max(10,G.zone.r*.6);
    G.zone.timer=CONFIG.ZONE_SHRINK_INTERVAL;
    G.zone.cx+=(Math.random()-.5)*G.zone.target*.3;
    G.zone.cz+=(Math.random()-.5)*G.zone.target*.3;
    UIManager.addKillFeed('系统','毒圈缩小！','');
  }
  if(G.zone.r>G.zone.target)G.zone.r=Math.max(G.zone.target,G.zone.r-dt*3);
  zoneMesh.scale.set(G.zone.r,1,G.zone.r);
  zoneMesh.position.x=G.zone.cx;zoneMesh.position.z=G.zone.cz;
  const dx=G.player.pos.x-G.zone.cx,dz=G.player.pos.z-G.zone.cz;
  const dist=Math.sqrt(dx*dx+dz*dz);
  const inZone=dist<=G.zone.r;
  $('zone-warning').style.display=inZone?'none':'block';
  if(!inZone)Player.takeDamage(CONFIG.ZONE_DAMAGE_BASE*dt*(1+Math.floor(G.zone.timer/CONFIG.ZONE_SHRINK_INTERVAL)*.5));
  const mins=Math.floor(G.zone.timer/60),secs=Math.floor(G.zone.timer%60);
  $('hud-zone-timer').textContent=`${mins}:${secs.toString().padStart(2,'0')}`;
}

// ===== 胜利检查 =====
function checkWin(){
  if(G.mode==='battle'&&G.enemies.filter(e=>e.alive).length===0&&G.hp>0){
    Game.endMatch(true);
  }
}

// ===== 游戏主管理 =====
const Game={
  startGame(){
    $('main-menu').classList.add('hidden');
    $('hud').classList.add('active');
    if(isMobile)$('mobile-controls').classList.add('active');
    // 重置
    G.hp=100;G.armor=0;G.kills=0;G.damageDealt=0;G.shotsFired=0;G.headshots=0;
    G.player.pos.set(0,CONFIG.DROP_ALTITUDE,0);G.player.vel.set(0,0,0);
    G.yaw=0;G.pitch=0;G.crouching=false;G.isADS=false;
    G.curW=0;G.weapons[0]={...WEAPONS[0]};G.weapons[1]=null;
    G.isDropping=true;G.parachute=false;G.reloading=false;
    G.lastPos.copy(G.player.pos);
    // 清理旧敌人
    G.enemies.forEach(e=>scene.remove(e.group));G.enemies=[];
    // 生成敌人
    const counts={battle:12,tdm:8,zombie:6,training:5};
    const types={battle:['normal','normal','heavy','fast'],tdm:['normal','fast'],zombie:['zombie'],training:['normal']};
    const count=counts[G.mode]||10;
    const typeArr=types[G.mode]||['normal'];
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2,d=25+Math.random()*45;
      G.enemies.push(new Enemy(Math.cos(a)*d,Math.sin(a)*d,typeArr[Math.floor(Math.random()*typeArr.length)]));
    }
    // 重置毒圈
    G.zone={r:CONFIG.ZONE_INITIAL_RADIUS,target:CONFIG.ZONE_INITIAL_RADIUS,cx:0,cz:0,timer:CONFIG.ZONE_SHRINK_INTERVAL};
    buildWeaponView();
    UIManager.updateHUD();
    G.state='dropping';G.startTime=performance.now();
    $('drop-screen').classList.add('active');
    $('drop-prompt').textContent=isMobile?'点击屏幕跳伞':'按 空格 跳伞';
  },
  startMatch(){
    G.state='playing';
    $('drop-screen').classList.remove('active');
    if(!isMobile)R.domElement.requestPointerLock();
  },
  pause(){
    if(G.state!=='playing')return;
    G.state='paused';$('pause-menu').classList.add('active');
    if(!isMobile)document.exitPointerLock();
  },
  resume(){
    G.state='playing';$('pause-menu').classList.remove('active');
    if(!isMobile)R.domElement.requestPointerLock();
  },
  endMatch(victory){
    G.state='dead';
    const dur=(performance.now()-G.startTime)/1000;
    save.kills+=G.kills;save.games++;if(victory)save.wins++;
    save.headshots+=G.headshots;save.shots+=G.shotsFired;
    save.time+=dur;save.dist+=G.dist;
    localStorage.setItem(SAVE_KEY,JSON.stringify(save));
    $('death-title').textContent=victory?'大吉大利，今晚吃鸡！':'已被淘汰';
    $('death-screen').classList.toggle('victory',victory);
    $('death-screen').classList.add('active');
    $('d-kills').textContent=G.kills;
    $('d-dmg').textContent=Math.round(G.damageDealt);
    const mins=Math.floor(dur/60),secs=Math.floor(dur%60);
    $('d-time').textContent=`${mins}:${secs.toString().padStart(2,'0')}`;
    $('d-rank').textContent='#'+(G.enemies.filter(e=>e.alive).length+1);
    if(!isMobile)document.exitPointerLock();
  },
  quitToMenu(){
    G.state='menu';
    $('hud').classList.remove('active');
    $('pause-menu').classList.remove('active');
    $('death-screen').classList.remove('active');
    $('drop-screen').classList.remove('active');
    $('mobile-controls').classList.remove('active');
    $('main-menu').classList.remove('hidden');
    G.enemies.forEach(e=>scene.remove(e.group));G.enemies=[];
    $('stat-kills').textContent=save.kills;$('stat-wins').textContent=save.wins;$('stat-games').textContent=save.games;
  }
};

// ===== 菜单事件 =====
document.querySelectorAll('.menu-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.menu-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.menu-content').forEach(c=>c.classList.remove('active'));
    tab.classList.add('active');

document.querySelectorAll('.mode-card').forEach(card=>{
  card.addEventListener('click',()=>{
    document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');

  });
});
$('btn-start').addEventListener('click',()=>{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  Game.startGame();
});
$('btn-resume').addEventListener('click',()=>Game.resume());
$('btn-quit').addEventListener('click',()=>Game.quitToMenu());
$('btn-respawn').addEventListener('click',()=>Game.quitToMenu());
window.addEventListener('keydown',e=>{if(e.code==='Escape'&&G.state==='playing')Game.pause();});

// ===== 主循环 =====
let last=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  
  if(G.state==='dropping'||G.state==='playing'){
    // 玩家更新
    if(G.state==='dropping'){
      if(!G.parachute){
        G.player.vel.y-=CONFIG.GRAVITY*dt;
        G.player.vel.y=Math.max(G.player.vel.y,-60);
      }else{
        G.player.vel.y-=CONFIG.GRAVITY*.1*dt;
        G.player.vel.y=Math.max(G.player.vel.y,-8);
        const fw=new THREE.Vector3(-Math.sin(G.yaw),0,-Math.cos(G.yaw));
        G.player.vel.x=fw.x*15;G.player.vel.z=fw.z*15;
      }
      G.player.pos.addScaledVector(G.player.vel,dt);
      $('drop-altitude').textContent=Math.max(0,Math.floor(G.player.pos.y))+'米';
      $('drop-speed').textContent='速度: '+Math.floor(Math.abs(G.player.vel.y)*3.6)+' km/h';
      if(!G.parachute&&(Input.keys['Space']||Input.mouseDown)){
        if(G.player.pos.y<CONFIG.DROP_ALTITUDE-50){G.parachute=true;$('drop-prompt').textContent=isMobile?'滑动屏幕控制方向':'WASD控制方向';}
      }
      if(G.player.pos.y<=CONFIG.PLAYER_HEIGHT){
        G.player.pos.y=CONFIG.PLAYER_HEIGHT;G.player.vel.set(0,0,0);
        Game.startMatch();
      }
    }else{
      // 正常移动
      const sens=(isMobile?4:8)*.001;
      G.yaw-=Input.mouseDX*sens;
      G.pitch-=Input.mouseDY*sens;
      G.pitch=Math.max(-1.5,Math.min(1.5,G.pitch));
      Input.mouseDX=0;Input.mouseDY=0;
      
      const spd=5*(G.crouching?.5:1);
      const fw=new THREE.Vector3(-Math.sin(G.yaw),0,-Math.cos(G.yaw));
      const rt=new THREE.Vector3(Math.cos(G.yaw),0,-Math.sin(G.yaw));
      const mv=new THREE.Vector3();
      // 键盘或摇杆
      if(Input.keys['KeyW'])mv.add(fw);
      if(Input.keys['KeyS'])mv.sub(fw);
      if(Input.keys['KeyD'])mv.add(rt);
      if(Input.keys['KeyA'])mv.sub(rt);
      mv.x+=fw.x*(-Input.joyY)+rt.x*Input.joyX;
      mv.z+=fw.z*(-Input.joyY)+rt.z*Input.joyX;
      if(mv.lengthSq()>0)mv.normalize();
      
      G.player.vel.x=mv.x*spd;G.player.vel.z=mv.z*spd;
      G.player.vel.y-=CONFIG.GRAVITY*dt;
      if(Input.keys['Space']&&G.player.onGround){G.player.vel.y=CONFIG.JUMP_FORCE;G.player.onGround=false;}
      
      const np=G.player.pos.clone();
      np.x+=G.player.vel.x*dt;
      if(!checkCollision(np))G.player.pos.x=np.x;
      np.z+=G.player.vel.z*dt;
      if(!checkCollision(np))G.player.pos.z=np.z;
      np.y+=G.player.vel.y*dt;
      if(checkCollision(np)){
        if(G.player.vel.y<0)G.player.onGround=true;
        G.player.vel.y=0;
      }else{G.player.pos.y=np.y;G.player.onGround=false;}
      
      const half=CONFIG.MAP_SIZE/2-2;
      G.player.pos.x=Math.max(-half,Math.min(half,G.player.pos.x));
      G.player.pos.z=Math.max(-half,Math.min(half,G.player.pos.z));
      if(G.player.pos.y<-10){G.player.pos.y=CONFIG.PLAYER_HEIGHT;G.player.vel.y=0;}
      
      // 距离统计
      const d=G.player.pos.distanceTo(G.lastPos);G.dist+=d;G.lastPos.copy(G.player.pos);
      
      // 射击
      if(Input.mouseDown){
        const wep=G.weapons[G.curW];
        if(wep&&(wep.auto||now-G.lastShot>=wep.rate))Player.shoot();
      }
      
      // 敌人更新
      for(const e of G.enemies)if(e.alive)e.update(dt);
      
      // 毒圈
      updateZone(dt);
    }
    
    // 相机
    camera.rotation.order='YXZ';
    G.recoilY=THREE.MathUtils.lerp(G.recoilY,0,dt*10);
    camera.rotation.set(G.pitch+G.recoilY,G.yaw,0);
    const h=G.crouching?CONFIG.CROUCH_HEIGHT:CONFIG.PLAYER_HEIGHT;
    G.swayT+=dt*(G.player.vel.length()>1?8:2);
    const bob=G.player.vel.length()>1?Math.sin(G.swayT)*.015:0;
    camera.position.set(G.player.pos.x,G.player.pos.y+bob,G.player.pos.z);
    wView.position.z=THREE.MathUtils.lerp(wView.position.z,-.5,dt*10);
    wView.rotation.x=THREE.MathUtils.lerp(wView.rotation.x,0,dt*10);
    
    // 粒子
    for(let i=G.particles.length-1;i>=0;i--){
      const p=G.particles[i];
      p.life-=dt;p.vel.y-=15*dt;
      p.mesh.position.addScaledVector(p.vel,dt);
      p.mesh.material.opacity=Math.max(0,p.life/p.maxLife);
      if(p.life<=0){scene.remove(p.mesh);G.particles.splice(i,1);}
    }
    
    UIManager.updateMinimap();
  }
  
  R.render(scene,camera);
}

function checkCollision(pos){
  const r=CONFIG.PLAYER_RADIUS;
  const h=G.crouching?CONFIG.CROUCH_HEIGHT:CONFIG.PLAYER_HEIGHT;
  const box=new THREE.Box3(new THREE.Vector3(pos.x-r,pos.y-h,pos.z-r),new THREE.Vector3(pos.x+r,pos.y+.2,pos.z+r));
  for(const c of colliders)if(c.intersectsBox(box))return true;
  return false;
}

// 窗口缩放
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  R.setSize(innerWidth,innerHeight);
});

loop();
</script>
