<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>绝地求生</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Microsoft YaHei',sans-serif;color:#e0e0e0;user-select:none}
canvas{display:block}
.hidden{display:none!important}
#login{position:fixed;inset:0;z-index:2000;background:linear-gradient(135deg,#060a10,#101820);display:flex;align-items:center;justify-content:center}
.lbox{width:90%;max-width:360px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:35px 30px;text-align:center}
.lbox h1{font-size:28px;color:#f8b500;margin-bottom:20px}
.lbox input{display:block;width:100%;padding:12px 16px;margin-bottom:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:14px;outline:none}
.lbox input:focus{border-color:#f8b500}
.lbtn{width:100%;padding:12px;background:linear-gradient(135deg,#f8b500,#ff8c00);border:none;border-radius:8px;color:#000;font-size:15px;font-weight:bold;cursor:pointer;margin-top:5px}
.lmsg{font-size:12px;margin-top:10px;min-height:16px;color:#f55}
.lsw{margin-top:15px;font-size:12px;color:#556}
.lsw a{color:#f8b500;cursor:pointer}
#menu{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#060a10,#101820);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mwrap{text-align:center;width:95%;max-width:800px}
.mlogo{font-size:min(8vw,48px);font-weight:900;background:linear-gradient(180deg,#fff,#f8b500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
.msub{color:#556;font-size:11px;margin-bottom:20px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.mcard{padding:14px 8px;background:rgba(255,255,255,.02);border:2px solid rgba(255,255,255,.05);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s}
.mcard:active{transform:scale(.95)}
.mcard.sel{border-color:#f8b500;background:rgba(248,181,0,.05)}
.mcard h3{font-size:12px;color:#fff;margin-top:5px}
.mcard p{font-size:9px;color:#556}
.mbtn2{padding:13px 50px;font-size:16px;font-weight:bold;background:linear-gradient(135deg,#f8b500,#ff8c00);border:none;border-radius:8px;color:#000;cursor:pointer;letter-spacing:2px}
#lstat{margin-top:10px;font-size:11px;color:#556}
#lstat.err{color:#f55}
#lstat.ok{color:#5c5}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#hud.on{display:block}
.xh{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.xl{position:absolute;background:rgba(255,255,255,.85)}
.xt{left:50%;top:-13px;width:2px;height:8px;transform:translateX(-50%)}
.xb{left:50%;bottom:-13px;width:2px;height:8px;transform:translateX(-50%)}
.xl2{left:-13px;top:50%;width:8px;height:2px;transform:translateY(-50%)}
.xr{right:-13px;top:50%;width:8px;height:2px;transform:translateY(-50%)}
.xd{position:absolute;left:50%;top:50%;width:3px;height:3px;background:#f44;border-radius:50%;transform:translate(-50%,-50%)}
#hm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;font-size:20px;color:#fff}
#hm.show{opacity:1}
#hm.hs{color:#f44}
#tbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:14px;background:rgba(0,0,0,.5);padding:4px 14px;border-radius:15px;font-size:11px}
#tbar b{color:#fff;margin-left:3px}
#kfeed{position:absolute;top:42px;right:8px;width:220px;font-size:10px}
.km{background:rgba(0,0,0,.6);padding:3px 8px;margin-bottom:2px;border-radius:3px;border-left:2px solid #f8b500;animation:kfa 3s forwards}
@keyframes kfa{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
#bars{position:absolute;bottom:10px;left:10px;width:180px}
.bbg{height:13px;background:rgba(0,0,0,.7);border-radius:3px;overflow:hidden;margin-bottom:4px;position:relative}
.bf{height:100%;transition:width .3s}
.hpf{background:linear-gradient(90deg,#c62828,#e53935)}
.arf{background:linear-gradient(90deg,#1565c0,#1e88e5)}
.btx{position:absolute;inset:0;display:flex;align-items:center;padding:0 5px;font-size:8px;color:#fff}
#apanel{position:absolute;bottom:10px;right:10px;text-align:right}
#apanel .wn{font-size:10px;color:#f8b500}
#apanel .am{font-size:26px;font-weight:900;color:#fff}
#apanel .am small{font-size:12px;color:#778}
#mm{position:absolute;top:8px;left:8px;width:100px;height:100px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
#mm canvas{width:100%;height:100%}
#zwarn{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:rgba(200,0,0,.85);color:#fff;padding:4px 14px;border-radius:5px;font-size:11px;display:none;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#dov{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .15s;z-index:15;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,0,0,.4))}
#drop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.3);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#drop.on{display:flex}
#dalt{font-size:min(12vw,48px);font-weight:900;color:#fff}
#dspd{font-size:16px;color:#f8b500;margin-top:5px}
#dhint{font-size:13px;color:#fff;margin-top:20px;animation:pulse 1.5s infinite;background:rgba(0,0,0,.4);padding:6px 16px;border-radius:5px}
#pause{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column}
#pause.on{display:flex}
#pause h2{color:#fff;margin-bottom:20px}
.pbtn{display:block;width:180px;padding:11px;margin:5px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:13px;cursor:pointer;border-radius:6px;text-align:center}
.pbtn:active{background:#f8b500;color:#000}
#death{position:fixed;inset:0;z-index:300;background:rgba(12,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column}
#death.on{display:flex}
#death h1{font-size:min(8vw,36px);color:#e53935;margin-bottom:12px}
#death.win h1{color:#f8b500}
#death .sts{display:flex;gap:20px;margin-bottom:20px}
#death .st{text-align:center}
#death .st .v{font-size:22px;font-weight:bold;color:#fff}
#death .st .l{font-size:9px;color:#778}
#mob{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#mob.on{display:block}
.joy{position:absolute;bottom:45px;left:12px;width:100px;height:100px;pointer-events:auto;touch-action:none}
.jbase{width:85px;height:85px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);position:relative}
.jknob{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.3);position:absolute;left:25px;top:25px}
.look{position:absolute;top:0;right:0;width:55%;height:70%;pointer-events:auto;touch-action:none}
.mb{position:absolute;pointer-events:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:bold;touch-action:none}
.mb:active{background:rgba(248,181,0,.2)}
#mbf{bottom:55px;right:15px;width:58px;height:58px;font-size:11px;background:rgba(255,50,50,.12)}
#mbj{bottom:140px;right:70px}
#mbr{bottom:140px;right:15px}
#mbc{bottom:55px;right:88px}
#mba{bottom:215px;right:15px}
#mbs{top:120px;right:8px;width:38px;height:38px}
</style>
</head>

<div id="dov"></div>

G.ry=THREE.MathUtils.lerp(G.ry,0,dt*10);
var bob=G.vel.length()>1?Math.sin(performance.now()*.008)*.012:0;
cam.rotation.set(G.pt+G.ry,G.yw,0);
cam.position.set(G.pos.x,G.pos.y+bob,G.pos.z);
wv.position.z=THREE.MathUtils.lerp(wv.position.z,-.5,dt*12);
wv.rotation.x=THREE.MathUtils.lerp(wv.rotation.x,-G.ry*2,dt*12);
for(var i=G.pt2.length-1;i>=0;i--){var p=G.pt2[i];p.l-=dt;p.v.y-=15*dt;p.m.position.addScaledVector(p.v,dt);p.m.material.opacity=Math.max(0,p.l);if(p.l<=0){sc.remove(p.m);G.pt2.splice(i,1)}}
dMM();
}
ren.render(sc,cam)}
window.addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
loop();
})();
